<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#screen{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
#touch{position:fixed;inset:0;display:none;touch-action:none}
#touch.on{display:block}
.tbtn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(20,16,42,.45);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.25);color:#fff;font:bold 13px/1 system-ui,sans-serif;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;margin:0;touch-action:none;transition:transform .06s,background .06s;-webkit-user-select:none;user-select:none;outline:none}
.tbtn svg{width:46%;height:46%;pointer-events:none}
.tbtn span{pointer-events:none;font-size:11px;text-shadow:0 1px 0 #000}
.tbtn.down{transform:scale(.92);background:rgba(90,150,255,.5)}
#btnPause{border-radius:12px;border-width:2px}

#btnUse{display:none;border-color:rgba(255,220,90,.85);background:rgba(60,44,8,.5)}
#btnUse.show{display:flex;animation:pulse 1s ease-in-out infinite}
#nameIn{position:fixed;display:none;opacity:0;font-size:16px;border:0;padding:0;margin:0;background:transparent;color:transparent;caret-color:transparent;z-index:6;outline:none}
#nameIn.on{display:block}
#btnItem{display:none;border-color:rgba(130,255,170,.9);background:rgba(10,52,34,.55)}
#btnItem.show{display:flex}
#btnItem canvas{width:54%;height:54%;image-rendering:pixelated;pointer-events:none}
#btnBall{display:none;border-color:rgba(255,160,200,.9);background:rgba(52,14,40,.55)}
#btnBall.show{display:flex}
#btnBall canvas{width:50%;height:50%;image-rendering:pixelated;pointer-events:none}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,220,90,.7),0 3px 0 rgba(0,0,0,.45)}}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(20,16,42,.35));display:none;pointer-events:none}

#stick.ghost{display:block;opacity:.35}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fb4ff 45%,#4a5aa8);box-shadow:0 2px 6px rgba(0,0,0,.5)}
#rotate{position:fixed;inset:0;display:none;background:#14102a;color:#ffe9a0;font:bold 18px/1.4 system-ui,sans-serif;text-align:center;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;padding:24px;box-sizing:border-box}
#rotate.on{display:flex}
#rotate .ph{width:54px;height:92px;border:5px solid #ffe9a0;border-radius:10px;animation:rot 1.8s ease-in-out infinite}

<script>
(function(){
'use strict';
/* ===================================================================
   Labyrinth Remake - M1.14 prototype (M1.10: bosses every 5th floor - King Gloop, Luggernaut, Coghoot - guarding a sealed portal; M1.9.1: shop panel clear of the HUD, decorations never diagonal to a door; M1.9: slot jackpot spray + crit fail, slower balloons, floor-long power-ups, shop + permanent balloon types + backpack, secret rooms, decorations, pits, Rattlebone skeleton, ghosts through doors; M1.8: endless floors, deeper wall textures, score + high scores, slot machine; M1.7: icon placement, debug hook gated, RANGED colour, L3 floor, top-strip touch, thicker Screamer ears; M1.6: QA fixes, Screamer bat-wing ears, L3 balance, phone buttons, elite readability; M1.5: Screamer redraw, full-screen map; M1.4: elite mobs, enemy shots, slime trails, power-ups).
   Everything here (code, pixel art, sounds, levels) is original and
   generated in code. Inspired by early-90s maze shooters.
   =================================================================== */
var W=480,H=300,HALF=150,PLANE=0.66,PROJ=(W/2)/PLANE,TS=64;
var SAVE_KEY='labyrinthRemake.save.v1';
var MAX_HEARTS=5;

/* ---------- PWA bits: inline manifest + icon as data URLs ---------- */
(function(){
  var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='#14102a'/><rect x='0' y='6' width='5' height='2' fill='#4a5c96'/><rect x='11' y='6' width='5' height='2' fill='#4a5c96'/><rect x='4' y='4' width='8' height='6' fill='#5d70ad'/><rect x='6' y='10' width='4' height='3' fill='#4a5c96'/><rect x='5' y='6' width='2' height='2' fill='#151b38'/><rect x='9' y='6' width='2' height='2' fill='#151b38'/><rect x='7' y='10' width='2' height='2' fill='#0c1024'/></svg>";
  var icon='data:image/svg+xml,'+encodeURIComponent(svg);
  document.getElementById('icon').href=icon;
  var man={name:'Labyrinth Remake',short_name:'Labyrinth',display:'fullscreen',orientation:'landscape',background_color:'#000000',theme_color:'#14102a',start_url:'.',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
  document.getElementById('manifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
})();

/* ---------- framebuffer ---------- */
var cv=document.getElementById('screen');
var ctx=cv.getContext('2d',{alpha:false,willReadFrequently:true});
var img=ctx.createImageData(W,H);
var buf=new Uint32Array(img.data.buffer);
var depth=new Float32Array(W*H);
function RGB(r,g,b){return (0xff000000|(b<<16)|(g<<8)|r)>>>0;}
function HEX(h){var n=parseInt(h.slice(1),16);return RGB(n>>16&255,n>>8&255,n&255);}
function shade(c,f){var r=(c&255)*f,g=(c>>8&255)*f,b=(c>>16&255)*f;return RGB(r>255?255:r|0,g>255?255:g|0,b>255?255:b|0);}
function mix(c1,c2,t){var it=1-t;return RGB(((c1&255)*it+(c2&255)*t)|0,((c1>>8&255)*it+(c2>>8&255)*t)|0,((c1>>16&255)*it+(c2>>16&255)*t)|0);}
var FOG=HEX('#0c0a16'),FR=FOG&255,FG=FOG>>8&255,FB=FOG>>16&255;
function fogMix(c,t){var it=256-t;return (0xff000000|((((c>>16&255)*it+FB*t)>>8)<<16)|((((c>>8&255)*it+FG*t)>>8)<<8)|(((c&255)*it+FR*t)>>8))>>>0;}
function fogT(d){var t=d*17;return t>215?215:t|0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function h2(i,j){var h=Math.imul(i|0,374761393)+Math.imul(j|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}

/* ---------- tiny pixel painter. Coordinates are "logical"; k = detail scale (k=1.5 gives 1.5x more pixels per shape) ---------- */
function Pix(w,h,k){k=k||1;this.k=k;this.w=Math.round(w*k);this.h=Math.round(h*k);this.px=new Uint32Array(this.w*this.h);}
Pix.prototype.raw=function(x,y,c){if(x>=0&&y>=0&&x<this.w&&y<this.h)this.px[y*this.w+x]=c;};
Pix.prototype.set=function(x,y,c){x=Math.floor(x);y=Math.floor(y);var k=this.k;if(k===1){this.raw(x,y,c);return;}var x0=Math.round(x*k),y0=Math.round(y*k),x1=Math.max(x0+1,Math.round((x+1)*k)),y1=Math.max(y0+1,Math.round((y+1)*k));for(var j=y0;j<y1;j++)for(var i=x0;i<x1;i++)this.raw(i,j,c);};
Pix.prototype.get=function(x,y){var k=this.k;x=Math.floor((Math.floor(x)+.5)*k);y=Math.floor((Math.floor(y)+.5)*k);if(x<0||y<0||x>=this.w||y>=this.h)return 0;return this.px[y*this.w+x];};
Pix.prototype.rect=function(x,y,w,h,c){var k=this.k,x0=Math.round(x*k),y0=Math.round(y*k),x1=Math.round((x+w)*k),y1=Math.round((y+h)*k);for(var j=y0;j<y1;j++)for(var i=x0;i<x1;i++)this.raw(i,j,c);};
Pix.prototype.ell=function(cx,cy,rx,ry,c){var k=this.k;cx*=k;cy*=k;rx*=k;ry*=k;for(var y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(var x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){var dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.raw(x,y,typeof c==='function'?c(x/k,y/k,dx,dy):c);}};
Pix.prototype.rell=function(cx,cy,rx,ry,a,c){var k=this.k,ca=Math.cos(a),sa=Math.sin(a),R=Math.max(rx,ry)*k+1;cx*=k;cy*=k;for(var y=Math.floor(cy-R);y<=Math.ceil(cy+R);y++)for(var x=Math.floor(cx-R);x<=Math.ceil(cx+R);x++){var px=x+.5-cx,py=y+.5-cy,u=(px*ca+py*sa)/(rx*k),v=(-px*sa+py*ca)/(ry*k);if(u*u+v*v<=1)this.raw(x,y,typeof c==='function'?c(x/k,y/k,u,v):c);}};
Pix.prototype.thick=function(x0,y0,x1,y1,r,c){var n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2*this.k)+1;for(var i=0;i<=n;i++){var t=i/n;this.ell(x0+(x1-x0)*t,y0+(y1-y0)*t,r,r,c);}};
Pix.prototype.poly=function(pts,c){var k=this.k,minY=1e9,maxY=-1e9,i;for(i=0;i<pts.length;i++){minY=Math.min(minY,pts[i][1]*k);maxY=Math.max(maxY,pts[i][1]*k);}
  for(var y=Math.floor(minY);y<=Math.ceil(maxY);y++){var yc=y+.5,xs=[];for(i=0;i<pts.length;i++){var a=pts[i],b=pts[(i+1)%pts.length],ay=a[1]*k,by=b[1]*k;if((ay<=yc&&by>yc)||(by<=yc&&ay>yc))xs.push(a[0]*k+(yc-ay)/(by-ay)*(b[0]-a[0])*k);}
    xs.sort(function(p,q){return p-q;});for(var j=0;j+1<xs.length;j+=2)for(var x=Math.ceil(xs[j]-.5);x<=Math.floor(xs[j+1]-.5);x++)this.raw(x,y,typeof c==='function'?c(x/k,y/k):c);}};
Pix.prototype.outline=function(c){var src=this.px.slice(),w=this.w,h=this.h;for(var y=0;y<h;y++)for(var x=0;x<w;x++){if(src[y*w+x]>>>24)continue;var n=(x>0&&src[y*w+x-1]>>>24)||(x<w-1&&src[y*w+x+1]>>>24)||(y>0&&src[(y-1)*w+x]>>>24)||(y<h-1&&src[(y+1)*w+x]>>>24);if(n)this.px[y*w+x]=c;}return this;};
Pix.prototype.darken=function(f){var p=new Pix(this.w,this.h,1);p.k=this.k;for(var i=0;i<this.px.length;i++){var c=this.px[i];p.px[i]=c>>>24?shade(c,f):0;}return p;};

/* ---------- procedural wall textures (64x64, M1.3: twice the detail of M1.2's 32x32) ---------- */
function texBrick(){var t=new Pix(TS,TS),R=rng(11),mortar=HEX('#857866'),cols=['#a8442c','#b5502f','#9a3b28','#b8583a','#a04a30'].map(HEX);
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var row=y>>4,off=(row&1)?16:0,bx=(x+off)&31,by=y&15,c;
    if(by>=14||bx>=30)c=shade(mortar,(by===14||bx===30?.95:.72)+R()*.22);
    else{var id=(row*7+((x+off)>>5)*3)%5,f=.86+R()*.18;if(by===0||bx===0)f+=.24;else if(by===1||bx===1)f+=.1;if(by===13||bx===29)f-=.26;else if(by===12||bx===28)f-=.1;if(R()<.05)f*=.78;if(h2(x>>1,y>>1)<.04)f*=1.15;c=shade(cols[id],f);}t.set(x,y,c);}
  for(var i=0;i<7;i++){var cx=(R()*TS)|0,cy=(R()*TS)|0,len=4+(R()*7|0);for(var j=0;j<len;j++){cx+=(R()*3|0)-1;cy+=1;var v=t.get(cx,cy);if(v)t.set(cx,cy,shade(v,.62));}}return t;}
function texStone(){var t=new Pix(TS,TS),R=rng(23),base=HEX('#6c7488');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var row=y>>5,off=(row&1)?16:0,bx=(x+off)&31,by=y&31,f=.9+R()*.16;
    if(bx>=30||by>=30)f=bx===30||by===30?.5:.4;else if(bx===0||by===0)f=1.32;else if(bx===1||by===1)f=1.14;else if(bx===29||by===29)f=.68;else if(bx===28||by===28)f=.82;
    if(R()<.06)f*=.78;f+=(h2((x+off)>>2,y>>2)-.5)*.1;var id=(row*3+((x+off)>>5))%3;t.set(x,y,shade(base,f*(1+id*.05)));}
  for(var i=0;i<10;i++){var cx=(R()*TS)|0,cy=(R()*TS)|0;t.set(cx,cy,shade(base,.55));t.set(cx+1,cy,shade(base,1.25));}return t;}
function texWood(){var t=new Pix(TS,TS),R=rng(37),cols=['#8a5a32','#7c4f2b','#94633a','#83552f'].map(HEX);
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var pl=x>>4,lx=x&15,f=.92+R()*.1;var g=Math.sin(y*.28+pl*2.1+Math.sin(x*.65+pl)*.7);if(g>.88)f*=.7;else if(g>.75)f*=.86;
    var kx=4+((pl*7)%8),ky=(pl*23)%64,kd=Math.hypot((lx-kx)*1.4,(y-ky));if(kd<3.2)f*=kd<1.5?.55:.75;
    if(lx===0)f=1.2;else if(lx===1)f*=1.08;if(lx===15)f=.5;else if(lx===14)f*=.8;
    var c=shade(cols[pl],f);if((y===6||y===57)&&(lx===7||lx===8))c=HEX(lx===7?'#e8d8b0':'#a89878');if((y===7||y===58)&&(lx===7||lx===8))c=HEX('#3a2614');t.set(x,y,c);}return t;}
function texTile(){var t=new Pix(TS,TS),R=rng(41),base=HEX('#2f8f8a'),grout=HEX('#183836');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var lx=x&15,ly=y&15,c;if(lx>=14||ly>=14)c=shade(grout,lx===14||ly===14?1.15:1);
    else{var f=.92+R()*.08+(((x>>4)+(y>>4))&1)*.08;if(lx===0||ly===0)f+=.18;if(lx===13||ly===13)f-=.18;if((lx===2||lx===3)&&(ly===2||ly===3))f=1.55;if(lx===4&&ly===2)f=1.3;c=shade(base,f);}t.set(x,y,c);}
  for(var i=0;i<5;i++){var cx=(R()*TS)|0,cy=(R()*TS)|0;for(var j=0;j<5;j++)t.set(cx+j,cy+(j>>1),shade(base,.7));}return t;}
function texMoss(){var t=texStone(),R=rng(53),m1=HEX('#4f8a2c'),m2=HEX('#3a6e20'),m3=HEX('#78b844'),m4=HEX('#2c5418');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var p=.78-y/50+Math.sin(x*.45)*.18+Math.sin(x*.19+1)*.15+(h2(x>>1,y>>1)-.5)*.3;if(R()<p){var r=R();t.set(x,y,r<.15?m3:r<.55?m1:r<.85?m2:m4);}}
  for(var i=0;i<9;i++){var dx=(R()*TS)|0,len=6+(R()*18|0);for(var j=0;j<len;j++){t.set(dx,12+j,j===len-1?m3:m2);if(j<len-3)t.set(dx+1,12+j,m4);}}return t;}
function texDoor(){var t=new Pix(TS,TS),base=HEX('#5a6ea8'),dark=HEX('#26305a'),lite=HEX('#9cb0e8'),R=rng(61);
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var f=.95+R()*.07,c=shade(base,f);
    if(x<4||x>59||y<4||y>59)c=(x<2||x>61||y<2||y>61)?shade(dark,.8):dark;else if(x<6||y<6)c=lite;else if(x>57||y>57)c=shade(base,.62);
    else if(y>=28&&y<=35)c=shade(base,y<=29?1.38:y>=34?.58:1.08);else if(x>=30&&x<=33&&y>7&&y<56)c=shade(base,x<=31?.58:1.22);
    t.set(x,y,c);}
  [[10,10],[52,10],[10,52],[52,52],[10,31],[52,31]].forEach(function(p){t.set(p[0],p[1],lite);t.set(p[0]+1,p[1],lite);t.set(p[0],p[1]+1,lite);t.set(p[0]+1,p[1]+1,shade(base,1.15));t.set(p[0]+2,p[1]+1,dark);t.set(p[0]+1,p[1]+2,dark);t.set(p[0]+2,p[1]+2,dark);});
  for(var yy=40;yy<52;yy++)for(var xx=14;xx<50;xx++)if(((xx+yy)&7)<2)t.set(xx,yy,shade(base,((xx+yy)&7)?.62:.78));return t;}
function texLocked(){var t=new Pix(TS,TS),base=HEX('#c08f2a'),dark=HEX('#5a3e0e'),lite=HEX('#ffd970'),R=rng(71),hole=HEX('#1a1006');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var f=.92+R()*.08,c=shade(base,f);
    if(x<4||x>59||y<4||y>59)c=dark;else if(x<6||y<6)c=lite;else if(x>57||y>57)c=shade(base,.6);
    else if((x===12||x===13||x===50||x===51)&&y>9&&y<54)c=shade(base,.68);else if((x===14||x===52)&&y>9&&y<54)c=shade(base,1.28);t.set(x,y,c);}
  t.ell(32,25,10,10,shade(base,.6));t.ell(32,25,8.4,8.4,lite);t.ell(32,25,7,7,shade(lite,.9));t.ell(32,25,5,5,hole);
  for(var yy=28;yy<45;yy++){var hw=2+((yy-28)/4|0);for(var xx=32-hw;xx<32+hw;xx++)t.set(xx,yy,hole);}

function updateYPuds(dt){for(var i=G.ypuds.length-1;i>=0;i--){G.ypuds[i].life-=dt;if(G.ypuds[i].life<=0)G.ypuds.splice(i,1);}if(!G.ypuds.length)return;
  G.ents.forEach(function(e){if(e.gone||e.state==='dead')return;if(e.ypT>0){e.ypT-=dt;return;}for(var k=0;k<G.ypuds.length;k++){var q=G.ypuds[k];if(Math.hypot(e.x-q.x,e.y-q.y)<q.r+.15){e.ypT=YPUD.every;stats.ypudHits++;sparkle(e.x,e.y,.15,'drop',3);hitEnemy(e);break;}}});}
/* ---- Rattlebone: collapses into a bone pile; smash it within 4.5 s or it reforms (tell: rattle + glowing eyes from 3 s) ---- */
function updateMobTimers(dt){for(var i=0;i<G.ents.length;i++){var e=G.ents[i];if(e.gone||e.state==='dead')continue;if(e.laughT>0)e.laughT-=dt;if(e.slowT>0)e.slowT-=dt;
    if(e.poison){e.poison.t-=dt;if(e.poison.t<=0){e.poison.n--;e.poison.t=POISON.every;stats.poisonTicks++;sparkle(e.x,e.y,.35,'spark',3);hitEnemy(e);if(e.poison&&e.poison.n<=0)e.poison=null;}} /* green balloons: damage over time */
    if(e.state==='pile'){e.pileT+=dt;if(e.pileT>=BONES.tell&&!e.told){e.told=true;SFX.rattle();}if(e.pileT>=BONES.reform)reform(e);}}} /* bone pile: tell at 3 s, reform at 4.5 s */
function collapse(e){e.state='pile';e.pileT=0;e.told=false;e.hp=0;e.tele=0;e.chargeT=0;e.hurtT=.15;stats.collapses++;SFX.crumble();for(var k=0;k<6;k++){var a=k/6*Math.PI*2;G.parts.push({kind:'puff',x:e.x,y:e.y,z:.15,vx:Math.cos(a)*.6,vy:Math.sin(a)*.6,vz:.2,life:.5,g:0,max:.6});}setMsg('IT FELL APART... SMASH THE BONES!',2);}
function reform(e){e.state='chase';e.hp=e.maxHp||MOBS[e.type].hp;e.pileT=0;e.told=false;e.reforms=(e.reforms||0)+1;e.atkT=.8;stats.reforms++;SFX.reform();sparkle(e.x,e.y,.4,'spark',8);}
/* ---------- M1.10 bosses: King Gloop, Luggernaut, Coghoot. A boss stays inside its arena room, wakes when you step in (or see it
   from close by), gets angrier at half health, and when it falls the sealed portal opens. ---------- */
var BOSS_LOOT={coins:15},BOSS_HP_PER_FLOOR=5;
function bossName(){var b=G.L&&G.L.def.boss;return b?MOBS[G.L.bossType||b.type].name:'THE BOSS';}
function applyBoss(e,floor){var b=bossFor(floor)||{tier:0,hpMul:1,cdMul:1,spdMul:1},M=MOBS[e.type];e.mods=[];e.scale=1;e.dmg=1;e.spdMul=b.spdMul;e.cdMul=b.cdMul;e.tier=b.tier;
  e.maxHp=Math.ceil(M.hp*b.hpMul)+BOSS_HP_PER_FLOOR*Math.max(0,(floor|0)-1);e.hp=e.maxHp;e.arena=G.L&&G.L.arena; /* M1.13.1: +5 HP per floor below the first */e.atkCD=1.6;e.tele=0;e.stack=3;e.hh=M.h;e.hop=0;e.z=0;e.split=0;e.orb=1;e.orbT=3;e.woke=false;return e;}
function bossActive(){var b=G.boss;return b&&!b.gone&&b.state!=='dead'&&b.woke?b:null;}
function bossClamp(e){var A=e.arena;if(!A)return false;var r=MOBS[e.type].bodyR,x=Math.max(A.x+r,Math.min(A.x+A.w-r,e.x)),y=Math.max(A.y+r,Math.min(A.y+A.h-r,e.y)),hit=x!==e.x||y!==e.y;e.x=x;e.y=y;return hit;}
function bossMove(e,tx,ty,step){var A=e.arena,r=MOBS[e.type].bodyR;if(A){tx=Math.max(A.x+r,Math.min(A.x+A.w-r,tx));ty=Math.max(A.y+r,Math.min(A.y+A.h-r,ty));}
  var dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);if(d<.05)return false;step=Math.min(step,d);return moveBody(e,dx/d*step,dy/d*step,r,MOBS[e.type].fly?false:'g');}
function bossShot(e,a,spd,kind,home){if(G.eshots.length>=ELITE_CFG.maxEnemyShots)G.eshots.shift();var M=MOBS[e.type],z=Math.min(.6,mobZ(e)+(e.hh||M.h)*.45);
  G.eshots.push({kind:kind,x:e.x+Math.cos(a)*.45,y:e.y+Math.sin(a)*.45,z:z,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,spd:spd,home:home||0,life:3.6,age:0,from:e.type,fc:-1});stats.eshotsFired++;stats.bossShots++;}
function bossFan(e,n,spread,spd,kind,home){var a0=Math.atan2(G.p.y-e.y,G.p.x-e.x);for(var i=0;i<n;i++)bossShot(e,n>1?a0+(i/(n-1)-.5)*spread:a0,spd,kind,home);}
function bossRing(e,n,spd,kind){var a0=Math.random()*Math.PI;for(var i=0;i<n;i++)bossShot(e,a0+i/n*Math.PI*2,spd,kind,0);}
function bossWake(e){var M=MOBS[e.type];e.woke=true;if(e.state==='idle')e.state='chase';G.boss=e;e.sndT=2.5;setMsg(M.name+' AWAKENS!',2.5);SFX.bossRoar();stats.bossWakes++;}
function updateBoss(e,dt,p){if(e.dormant)return;var M=MOBS[e.type],A=e.arena,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1e-6;
  if(!e.woke){var inA=A&&p.x>A.x-.3&&p.x<A.x+A.w+.3&&p.y>A.y-.3&&p.y<A.y+A.h+.3;if(inA&&!e.introDone&&api.bossIntro){startBossIntro(e,null);return;}if(inA||e.state==='chase'||(d<7&&los(e.x,e.y,p.x,p.y)))bossWake(e);else return;}
  if(!G.boss)G.boss=e;
  if(!e.doorsLocked&&A&&p.x>A.x+.3&&p.x<A.x+A.w-.3&&p.y>A.y+.3&&p.y<A.y+A.h-.3){if(!e.introDone&&api.bossIntro){startBossIntro(e,null);return;}arenaLock(e,true);}
  e.sndT-=dt;if(e.sndT<=0&&d<12)voice(e);
  if(e.atkT>0)e.atkT-=dt;
  if(!e.enraged&&e.hp<=e.maxHp/2){e.enraged=true;setMsg(M.name+' IS FURIOUS!',2);SFX.bossRoar();stats.bossEnrages++;}
  BOSS_AI[e.type](e,dt,p,dx,dy,d);bossClamp(e);
  for(var j=0;j<G.ents.length;j++){var o=G.ents[j];if(o===e||o.gone||o.state==='dead'||o.state==='pile')continue;var ox=o.x-e.x,oy=o.y-e.y,od=Math.hypot(ox,oy);if(od<M.bodyR+.25&&od>0)moveBody(o,ox/od*.03,oy/od*.03,.28,MOBS[o.type].ghost?true:(MOBS[o.type].fly?false:'g'));} /* minions get nudged aside, the boss doesn't budge */
  if(Math.hypot(p.x-e.x,p.y-e.y)<M.reach&&e.atkT<=0){e.atkT=1.3;hurtPlayer(e);}}
var BOSS_AI={
  /* hops at you; lobs a fan of jelly (5, then 7 when furious); at 2/3 and 1/3 health two minions pop out; furious landings leave goo */
  king:function(e,dt,p,dx,dy,d){var was=e.hop%1;e.hop+=dt*(e.enraged?1:.8);var fr=e.hop%1;e.air=fr<.55;e.z=e.air?Math.sin(fr/.55*Math.PI)*.15:0;
    if(was<.55&&fr>=.55){e.squash=.22;SFX.thud();if(e.enraged)addPuddle(e.x,e.y);}if(e.squash>0)e.squash-=dt;
    if(e.tele>0){e.tele-=dt;if(e.tele<=0){bossFan(e,e.enraged?7:5,e.enraged?1.3:1,3.4,'gloop',0);SFX.gloopFire();}}
    else{e.atkCD-=dt;if(e.atkCD<=0&&d<9&&los(e.x,e.y,p.x,p.y)){e.tele=.6;e.atkCD=3.2*e.cdMul*(e.enraged?.8:1);SFX.charge();stats.telegraphs++;}}
    if(e.air&&!(e.tele>0))bossMove(e,p.x,p.y,MOBS.king.speed*e.spdMul*(e.enraged?1.35:1)*2.2*dt);
    if(e.split<2&&e.hp<=e.maxHp*(e.split===0?2/3:1/3)){e.split++;bossMinions(e,2);}},
  /* walks at you, fans socks or charges; at 2/3 and 1/3 health a suitcase bursts (sock ring + coins) and the rest gets faster */
  lugg:function(e,dt,p,dx,dy,d){var M=MOBS.lugg,st=e.hp>e.maxHp*2/3?3:e.hp>e.maxHp/3?2:1;
    if(st<e.stack){e.stack=st;e.hh=M.h*[0,.42,.7,1][st];e.chargeT=0;e.tele=0;caseBurst(e);}
    if(e.stun>0){e.stun-=dt;return;}
    if(e.chargeT>0){e.chargeT-=dt;var sp=4.6*e.spdMul*dt,moved=moveBody(e,e.cdx*sp,e.cdy*sp,M.bodyR,'g');if(bossClamp(e)||!moved){e.chargeT=0;e.stun=.7;SFX.bonk();sparkle(e.x+e.cdx*.4,e.y+e.cdy*.4,.4,'spark',8);}return;}
    if(e.tele>0){e.tele-=dt;if(e.tele<=0){if(e.next==='charge'){e.chargeT=.9;e.cdx=dx/d;e.cdy=dy/d;SFX.zipper();stats.charges++;}else{if(e.stack===3)bossFan(e,3,.6,4.2,'sock');else if(e.stack===2)bossFan(e,5,1,4.4,'sock');else bossFan(e,2,.22,5,'sock');SFX.sockFire();}}return;}
    e.atkCD-=dt;if(e.atkCD<=0&&d<9&&los(e.x,e.y,p.x,p.y)){e.next=d>1.8&&d<6&&Math.random()<.4?'charge':'socks';e.tele=e.next==='charge'?.55:.45;e.atkCD=(e.stack===1?1.3:2.4)*e.cdMul;SFX.charge();stats.telegraphs++;return;}
    bossMove(e,p.x,p.y,M.speed*e.spdMul*[0,1.75,1.35,1][e.stack]*dt);},
  /* flies circles around you, shoots three homing gears, sometimes swoops; furious: rings of gears too */
  owl:function(e,dt,p,dx,dy,d){var M=MOBS.owl,sp=M.speed*e.spdMul*(e.enraged?1.25:1);
    if(e.swoopT>0){e.swoopT-=dt;moveBody(e,e.cdx*5*e.spdMul*dt,e.cdy*5*e.spdMul*dt,M.bodyR,false);if(bossClamp(e))e.swoopT=0;return;}
    if(e.tele>0){e.tele-=dt;if(e.tele<=0){if(e.next==='swoop'){e.swoopT=.75;e.cdx=dx/d;e.cdy=dy/d;SFX.hoot();}else if(e.next==='ring'){bossRing(e,8,3,'gear');SFX.gearFire();}else{bossFan(e,3,.7,3.2,'gear',.9);SFX.gearFire();}}return;}
    e.atkCD-=dt;if(e.atkCD<=0&&d<10&&los(e.x,e.y,p.x,p.y)){var r=Math.random();e.next=r<.3?'swoop':(e.enraged&&r<.55?'ring':'gears');e.tele=e.next==='swoop'?.45:.5;e.atkCD=2.6*e.cdMul;SFX.charge();stats.telegraphs++;return;}
    var rad=(d-3)*.8,mx=-dy/d*e.orb+dx/d*rad,my=dx/d*e.orb+dy/d*rad,ml=Math.hypot(mx,my)||1;moveBody(e,mx/ml*sp*dt,my/ml*sp*dt,M.bodyR,false);if(bossClamp(e))e.orb=-e.orb;
    e.orbT-=dt;if(e.orbT<=0){e.orbT=2+Math.random()*3;e.orb=-e.orb;}}};
/* King Gloop's minions: mobs from this floor's pool, inside the arena, never more than 4 alive at once */
function bossMinions(e,n){var A=e.arena,floor=G.levelIdx+1,pool=poolFor(floor),k=deepHpMul(floor),live=G.ents.filter(function(o){return o.minion&&!o.gone&&o.state!=='dead';}).length,made=0;
  for(var i=0;i<n&&live+made<4;i++){var a=Math.random()*Math.PI*2,x=e.x+Math.cos(a)*.9,y=e.y+Math.sin(a)*.9;if(A){x=Math.max(A.x+.35,Math.min(A.x+A.w-.35,x));y=Math.max(A.y+.35,Math.min(A.y+A.h-.35,y));}
    if(solidAt(x,y)||pitUnder(x,y,0)){x=e.x;y=e.y;}var t=pool[Math.floor(Math.random()*pool.length)],m=newMob(t,x,y);applyMods(m,[]);scaleMob(m,floor);
    m.state='chase';m.spawned=true;m.minion=true;m.atkT=.8;G.ents.push(m);made++;for(var q=0;q<5;q++){var b=q/5*Math.PI*2;G.parts.push({kind:'puff',x:x,y:y,z:.25,vx:Math.cos(b)*.7,vy:Math.sin(b)*.7,vz:.4,life:.5,g:0,max:.7});}}
  if(made){G.stats.enemiesTotal+=made;stats.bossMinions+=made;G.distT=0; /* path maps refresh next step (they are read later in this same loop) */SFX.split();setMsg(MOBS[e.type].name+' SPLITS OFF MINIONS!',2);}return made;}
function caseBurst(e){bossRing(e,10,3.6,'sock');coinBurst(e.x,e.y,3);SFX.caseBurst();stats.caseBursts++;for(var k=0;k<10;k++){var a=k/10*Math.PI*2;G.parts.push({kind:'puff',x:e.x,y:e.y,z:.4+e.stack*.15,vx:Math.cos(a)*1.2,vy:Math.sin(a)*1.2,vz:.6,life:.6,g:1,max:.7});}
  setMsg(e.stack===1?'LAST SUITCASE STANDING!':'A SUITCASE BURST OPEN!',2);}
/* coins thrown out of a spot; they bounce and settle like the slot jackpot spray */
function coinBurst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,sp=.8+Math.random()*2.4;G.items.push({kind:'coin',x:x,y:y,z:.5,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:1.4+Math.random()*2,ph:i%6,fly:true,spray:true});}}
function bossDying(e,dt){e.deadT+=dt;if(Math.random()<dt*14){var a=Math.random()*Math.PI*2;G.parts.push({kind:'puff',x:e.x+Math.cos(a)*.3,y:e.y+Math.sin(a)*.3,z:.2+Math.random()*.5,vx:Math.cos(a)*.6,vy:Math.sin(a)*.6,vz:.5,life:.5,g:0,max:.7});}
  if(e.deadT>=1.1&&!e.popped){e.popped=true;e.gone=true;bossDefeated(e);}}
/* M1.10: once you are inside the arena every door in its wall slams shut and stays locked until the boss falls */
function arenaDoors(A){return G.L.doors.filter(function(d){var inX=d.x>=A.x&&d.x<A.x+A.w,inY=d.y>=A.y&&d.y<A.y+A.h;return (inX&&(d.y===A.y-1||d.y===A.y+A.h))||(inY&&(d.x===A.x-1||d.x===A.x+A.w));});}
function arenaLock(e,on){var A=e.arena;if(!A)return 0;var n=0;arenaDoors(A).forEach(function(d){if(on){if(d.bossLock)return;d.bossLock=true;d.wasLocked=d.locked;d.locked=true;d.tex=6;d.state=d.open>0?'closing':'closed';n++;}
    else if(d.bossLock){d.bossLock=false;d.locked=!!d.wasLocked;d.tex=d.locked?6:5;n++;}});
  e.doorsLocked=on;if(on&&n){SFX.slam();G.shake=.6;setMsg(MOBS[e.type].name+' LOCKS YOU IN!',2.5);stats.arenaLocks++;}return n;}
/* M1.10.2 boss cut scene (5 s, game paused): opening an arena door pulls you into the room, the doors slam and lock behind you
   (shake + slam), the view turns to the boss and "VS <NAME>" comes up between letterbox bars. Then the fight starts. */
var INTRO={T:5,walk:1.3,slam:1.4,pan:[1.5,2.4],vs:1.7};
function introBossFor(d){var b=null;G.ents.forEach(function(o){if(MOBS[o.type].boss&&!o.gone&&o.state!=='dead'&&!o.introDone&&!o.dormant)b=o;});if(!b||!b.arena||!api.bossIntro)return null;return arenaDoors(b.arena).indexOf(d)>=0?b:null;}
function startBossIntro(e,door){var p=G.p,A=e.arena,tx=p.x,ty=p.y,via=null;e.introDone=true;
  if(door){var dir=door.x<A.x?[1,0]:door.x>=A.x+A.w?[-1,0]:door.y<A.y?[0,1]:[0,-1];via={x:door.x+.5,y:door.y+.5};tx=door.x+.5+dir[0]*1.6;ty=door.y+.5+dir[1]*1.6;if(solidAt(tx,ty)||pitUnder(tx,ty,0)){tx=door.x+.5+dir[0];ty=door.y+.5+dir[1];}}
  resetInputs();G.intro={e:e,door:door,x0:p.x,y0:p.y,via:via,x1:tx,y1:ty,a0:p.ang,p0:p.pitch,slammed:false,roared:false};G.mode='intro';G.modeT=0;G.eshots=[];stats.bossIntros++;}
function introLerpAng(a,b,t){var d=Math.atan2(Math.sin(b-a),Math.cos(b-a));return a+d*t;}
function updateIntro(dt){var I=G.intro,p=G.p,e=I&&I.e,t=G.modeT;if(!I){G.mode='play';return;}
  updateDoors(dt);updateFx(dt);e.ph+=dt;if(G.shake>0)G.shake-=dt;
  var w=Math.min(1,t/INTRO.walk),ease=w*w*(3-2*w);if(I.via){var h=.45;if(ease<h){var k=ease/h;p.x=I.x0+(I.via.x-I.x0)*k;p.y=I.y0+(I.via.y-I.y0)*k;}else{var k2=(ease-h)/(1-h);p.x=I.via.x+(I.x1-I.via.x)*k2;p.y=I.via.y+(I.y1-I.via.y)*k2;}p.bob+=dt*9*(w<1?1:0);p.moving=w<1?1:Math.max(0,p.moving-dt*4);}
  if(!I.slammed&&t>=INTRO.slam){I.slammed=true;arenaLock(e,true);}
  var ab=Math.atan2(e.y-p.y,e.x-p.x),pt=Math.max(0,Math.min(1,(t-INTRO.pan[0])/(INTRO.pan[1]-INTRO.pan[0])));if(t<INTRO.pan[0]){if(I.via){var aw=Math.atan2(I.y1-I.y0,I.x1-I.x0);p.ang=introLerpAng(I.a0,aw,Math.min(1,t/.5));}}else{p.ang=introLerpAng(p.ang,ab,pt<1?Math.min(1,dt*6+pt*pt*.2):1);if(pt>=1)p.ang=ab;}p.pitch*=Math.max(0,1-dt*4);
  if(!I.roared&&t>=INTRO.vs){I.roared=true;voice(e);SFX.bossRoar();G.shake=.45;}
  if(t>=INTRO.T){G.mode='play';G.modeT=0;G.intro=null;p.ang=ab;bossWake(e);e.atkCD=Math.max(e.atkCD,1.2);e.atkT=Math.max(e.atkT||0,1);if(G.lastInput==='kb')requestLock();}}
function drawFaceHug(){var a=Math.min(1,G.faceT/1.2),sp=SPR.faceSpider[((G.time*7)|0)%2],sc=Math.max(W/sp.w,H/sp.h)*1.02,ox=W/2-sp.w*sc/2+Math.sin(G.time*13)*4,oy=H/2-sp.h*sc/2+Math.cos(G.time*11)*4;
  for(var y=0;y<H;y++){var v=((y-oy)/sc)|0;if(v<0||v>=sp.h)continue;for(var x=0;x<W;x++){var u=((x-ox)/sc)|0;if(u<0||u>=sp.w)continue;var c=sp.px[v*sp.w+u];if(!(c>>>24))continue;var i=y*W+x;buf[i]=mix(buf[i],c,a);}}stats.faceDrawn=(stats.faceDrawn||0)+1;}
function drawWebbed(){var p=G.p;if(!(p&&p.slowT>0))return;var a=Math.min(.5,p.slowT/3*.6),Wc=HEX('#e8e8f0');for(var k=0;k<4;k++){var cx=k&1?W-1:0,cy=k&2?H-1:0;for(var r=10;r<70;r+=12)for(var t=0;t<14;t++){var an=t/14*Math.PI/2,x=Math.round(cx+(k&1?-1:1)*Math.cos(an)*r),y=Math.round(cy+(k&2?-1:1)*Math.sin(an)*r);if(x>=0&&y>=0&&x<W&&y<H)buf[y*W+x]=mix(buf[y*W+x],Wc,a);}for(var s2=0;s2<5;s2++){var an2=s2/4*Math.PI/2;for(var r2=0;r2<70;r2+=1){var x2=Math.round(cx+(k&1?-1:1)*Math.cos(an2)*r2),y2=Math.round(cy+(k&2?-1:1)*Math.sin(an2)*r2);if(x2>=0&&y2>=0&&x2<W&&y2<H)buf[y2*W+x2]=mix(buf[y2*W+x2],Wc,a);}}}}
function drawIntro(){var I=G.intro;if(!I)return;var t=G.modeT,e=I.e,M=MOBS[e.type],bar=Math.round(Math.min(1,t/.5)*44),Y1=HEX('#ffe27a'),OR=HEX('#ff9a3a');
  blend(0,0,W,bar,HEX('#000000'),1);blend(0,H-bar,W,bar,HEX('#000000'),1);
  if(t>=INTRO.vs){var k=Math.min(1,(t-INTRO.vs)/.35),fade=t>INTRO.T-.4?Math.max(0,(INTRO.T-t)/.4):1;if(fade<=0)return;
