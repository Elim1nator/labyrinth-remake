<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

.tbtn svg{width:46%;height:46%;pointer-events:none}

.tbtn.down{transform:scale(.92);background:rgba(90,150,255,.5)}
#btnPause{border-radius:12px;border-width:2px}
#btnPause svg{width:55%;height:55%}
#btnMap{border-radius:12px;border-width:2px;border-color:rgba(140,210,255,.85);background:rgba(10,30,60,.5)}
#btnMap svg{width:64%;height:64%}
#btnUse{display:none;border-color:rgba(255,220,90,.85);background:rgba(60,44,8,.5)}

#nameIn.on{display:block}

@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,220,90,.7),0 3px 0 rgba(0,0,0,.45)}}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(20,16,42,.35));display:none;pointer-events:none}
#stick.on{display:block}
#stick.ghost{display:block;opacity:.35}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fb4ff 45%,#4a5aa8);box-shadow:0 2px 6px rgba(0,0,0,.5)}

<script>
(function(){
'use strict';
/* ===================================================================
   Labyrinth Remake - M1.8 prototype (endless floors, deeper wall textures, score + high scores, slot machine; M1.7: icon placement, debug hook gated, RANGED colour, L3 floor, top-strip touch, thicker Screamer ears; M1.6: QA fixes, Screamer bat-wing ears, L3 balance, phone buttons, elite readability; M1.5: Screamer redraw, full-screen map; M1.4: elite mobs, enemy shots, slime trails, power-ups).
   Everything here (code, pixel art, sounds, levels) is original and
   generated in code. Inspired by early-90s maze shooters.
   =================================================================== */
var W=480,H=300,HALF=150,PLANE=0.66,PROJ=(W/2)/PLANE,TS=64;
var SAVE_KEY='labyrinthRemake.save.v1';
var MAX_HEARTS=5;

/* ---------- PWA bits: inline manifest + icon as data URLs ---------- */
(function(){
  var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='#14102a'/><rect x='0' y='6' width='5' height='2' fill='#4a5c96'/><rect x='11' y='6' width='5' height='2' fill='#4a5c96'/><rect x='4' y='4' width='8' height='6' fill='#5d70ad'/><rect x='6' y='10' width='4' height='3' fill='#4a5c96'/><rect x='5' y='6' width='2' height='2' fill='#151b38'/><rect x='9' y='6' width='2' height='2' fill='#151b38'/><rect x='7' y='10' width='2' height='2' fill='#0c1024'/></svg>";
  var icon='data:image/svg+xml,'+encodeURIComponent(svg);
  document.getElementById('icon').href=icon;
  var man={name:'Labyrinth Remake',short_name:'Labyrinth',display:'fullscreen',orientation:'landscape',background_color:'#000000',theme_color:'#14102a',start_url:'.',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
  document.getElementById('manifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
})();

/* ---------- framebuffer ---------- */
var cv=document.getElementById('screen');
var ctx=cv.getContext('2d',{alpha:false,willReadFrequently:true});
var img=ctx.createImageData(W,H);
var buf=new Uint32Array(img.data.buffer);
var depth=new Float32Array(W*H);
function RGB(r,g,b){return (0xff000000|(b<<16)|(g<<8)|r)>>>0;}
function HEX(h){var n=parseInt(h.slice(1),16);return RGB(n>>16&255,n>>8&255,n&255);}
function shade(c,f){var r=(c&255)*f,g=(c>>8&255)*f,b=(c>>16&255)*f;return RGB(r>255?255:r|0,g>255?255:g|0,b>255?255:b|0);}
function mix(c1,c2,t){var it=1-t;return RGB(((c1&255)*it+(c2&255)*t)|0,((c1>>8&255)*it+(c2>>8&255)*t)|0,((c1>>16&255)*it+(c2>>16&255)*t)|0);}
var FOG=HEX('#0c0a16'),FR=FOG&255,FG=FOG>>8&255,FB=FOG>>16&255;
function fogMix(c,t){var it=256-t;return (0xff000000|((((c>>16&255)*it+FB*t)>>8)<<16)|((((c>>8&255)*it+FG*t)>>8)<<8)|(((c&255)*it+FR*t)>>8))>>>0;}
function fogT(d){var t=d*17;return t>215?215:t|0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function h2(i,j){var h=Math.imul(i|0,374761393)+Math.imul(j|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}

/* ---------- tiny pixel painter. Coordinates are "logical"; k = detail scale (k=1.5 gives 1.5x more pixels per shape) ---------- */
function Pix(w,h,k){k=k||1;this.k=k;this.w=Math.round(w*k);this.h=Math.round(h*k);this.px=new Uint32Array(this.w*this.h);}
Pix.prototype.raw=function(x,y,c){if(x>=0&&y>=0&&x<this.w&&y<this.h)this.px[y*this.w+x]=c;};
Pix.prototype.set=function(x,y,c){x=Math.floor(x);y=Math.floor(y);var k=this.k;if(k===1){this.raw(x,y,c);return;}var x0=Math.round(x*k),y0=Math.round(y*k),x1=Math.max(x0+1,Math.round((x+1)*k)),y1=Math.max(y0+1,Math.round((y+1)*k));for(var j=y0;j<y1;j++)for(var i=x0;i<x1;i++)this.raw(i,j,c);};
Pix.prototype.get=function(x,y){var k=this.k;x=Math.floor((Math.floor(x)+.5)*k);y=Math.floor((Math.floor(y)+.5)*k);if(x<0||y<0||x>=this.w||y>=this.h)return 0;return this.px[y*this.w+x];};
Pix.prototype.rect=function(x,y,w,h,c){var k=this.k,x0=Math.round(x*k),y0=Math.round(y*k),x1=Math.round((x+w)*k),y1=Math.round((y+h)*k);for(var j=y0;j<y1;j++)for(var i=x0;i<x1;i++)this.raw(i,j,c);};
Pix.prototype.ell=function(cx,cy,rx,ry,c){var k=this.k;cx*=k;cy*=k;rx*=k;ry*=k;for(var y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(var x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){var dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.raw(x,y,typeof c==='function'?c(x/k,y/k,dx,dy):c);}};
Pix.prototype.rell=function(cx,cy,rx,ry,a,c){var k=this.k,ca=Math.cos(a),sa=Math.sin(a),R=Math.max(rx,ry)*k+1;cx*=k;cy*=k;for(var y=Math.floor(cy-R);y<=Math.ceil(cy+R);y++)for(var x=Math.floor(cx-R);x<=Math.ceil(cx+R);x++){var px=x+.5-cx,py=y+.5-cy,u=(px*ca+py*sa)/(rx*k),v=(-px*sa+py*ca)/(ry*k);if(u*u+v*v<=1)this.raw(x,y,typeof c==='function'?c(x/k,y/k,u,v):c);}};
Pix.prototype.thick=function(x0,y0,x1,y1,r,c){var n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2*this.k)+1;for(var i=0;i<=n;i++){var t=i/n;this.ell(x0+(x1-x0)*t,y0+(y1-y0)*t,r,r,c);}};
Pix.prototype.poly=function(pts,c){var k=this.k,minY=1e9,maxY=-1e9,i;for(i=0;i<pts.length;i++){minY=Math.min(minY,pts[i][1]*k);maxY=Math.max(maxY,pts[i][1]*k);}
  for(var y=Math.floor(minY);y<=Math.ceil(maxY);y++){var yc=y+.5,xs=[];for(i=0;i<pts.length;i++){var a=pts[i],b=pts[(i+1)%pts.length],ay=a[1]*k,by=b[1]*k;if((ay<=yc&&by>yc)||(by<=yc&&ay>yc))xs.push(a[0]*k+(yc-ay)/(by-ay)*(b[0]-a[0])*k);}
    xs.sort(function(p,q){return p-q;});for(var j=0;j+1<xs.length;j+=2)for(var x=Math.ceil(xs[j]-.5);x<=Math.floor(xs[j+1]-.5);x++)this.raw(x,y,typeof c==='function'?c(x/k,y/k):c);}};
Pix.prototype.outline=function(c){var src=this.px.slice(),w=this.w,h=this.h;for(var y=0;y<h;y++)for(var x=0;x<w;x++){if(src[y*w+x]>>>24)continue;var n=(x>0&&src[y*w+x-1]>>>24)||(x<w-1&&src[y*w+x+1]>>>24)||(y>0&&src[(y-1)*w+x]>>>24)||(y<h-1&&src[(y+1)*w+x]>>>24);if(n)this.px[y*w+x]=c;}return this;};
Pix.prototype.darken=function(f){var p=new Pix(this.w,this.h,1);p.k=this.k;for(var i=0;i<this.px.length;i++){var c=this.px[i];p.px[i]=c>>>24?shade(c,f):0;}return p;};

/* ---------- procedural wall textures (64x64, M1.3: twice the detail of M1.2's 32x32) ---------- */
function texBrick(){var t=new Pix(TS,TS),R=rng(11),mortar=HEX('#857866'),cols=['#a8442c','#b5502f','#9a3b28','#b8583a','#a04a30'].map(HEX);
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var row=y>>4,off=(row&1)?16:0,bx=(x+off)&31,by=y&15,c;
    if(by>=14||bx>=30)c=shade(mortar,(by===14||bx===30?.95:.72)+R()*.22);
    else{var id=(row*7+((x+off)>>5)*3)%5,f=.86+R()*.18;if(by===0||bx===0)f+=.24;else if(by===1||bx===1)f+=.1;if(by===13||bx===29)f-=.26;else if(by===12||bx===28)f-=.1;if(R()<.05)f*=.78;if(h2(x>>1,y>>1)<.04)f*=1.15;c=shade(cols[id],f);}t.set(x,y,c);}
  for(var i=0;i<7;i++){var cx=(R()*TS)|0,cy=(R()*TS)|0,len=4+(R()*7|0);for(var j=0;j<len;j++){cx+=(R()*3|0)-1;cy+=1;var v=t.get(cx,cy);if(v)t.set(cx,cy,shade(v,.62));}}return t;}
function texStone(){var t=new Pix(TS,TS),R=rng(23),base=HEX('#6c7488');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var row=y>>5,off=(row&1)?16:0,bx=(x+off)&31,by=y&31,f=.9+R()*.16;
    if(bx>=30||by>=30)f=bx===30||by===30?.5:.4;else if(bx===0||by===0)f=1.32;else if(bx===1||by===1)f=1.14;else if(bx===29||by===29)f=.68;else if(bx===28||by===28)f=.82;
    if(R()<.06)f*=.78;f+=(h2((x+off)>>2,y>>2)-.5)*.1;var id=(row*3+((x+off)>>5))%3;t.set(x,y,shade(base,f*(1+id*.05)));}
  for(var i=0;i<10;i++){var cx=(R()*TS)|0,cy=(R()*TS)|0;t.set(cx,cy,shade(base,.55));t.set(cx+1,cy,shade(base,1.25));}return t;}
function texWood(){var t=new Pix(TS,TS),R=rng(37),cols=['#8a5a32','#7c4f2b','#94633a','#83552f'].map(HEX);
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var pl=x>>4,lx=x&15,f=.92+R()*.1;var g=Math.sin(y*.28+pl*2.1+Math.sin(x*.65+pl)*.7);if(g>.88)f*=.7;else if(g>.75)f*=.86;
    var kx=4+((pl*7)%8),ky=(pl*23)%64,kd=Math.hypot((lx-kx)*1.4,(y-ky));if(kd<3.2)f*=kd<1.5?.55:.75;
    if(lx===0)f=1.2;else if(lx===1)f*=1.08;if(lx===15)f=.5;else if(lx===14)f*=.8;
    var c=shade(cols[pl],f);if((y===6||y===57)&&(lx===7||lx===8))c=HEX(lx===7?'#e8d8b0':'#a89878');if((y===7||y===58)&&(lx===7||lx===8))c=HEX('#3a2614');t.set(x,y,c);}return t;}
function texTile(){var t=new Pix(TS,TS),R=rng(41),base=HEX('#2f8f8a'),grout=HEX('#183836');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var lx=x&15,ly=y&15,c;if(lx>=14||ly>=14)c=shade(grout,lx===14||ly===14?1.15:1);
    else{var f=.92+R()*.08+(((x>>4)+(y>>4))&1)*.08;if(lx===0||ly===0)f+=.18;if(lx===13||ly===13)f-=.18;if((lx===2||lx===3)&&(ly===2||ly===3))f=1.55;if(lx===4&&ly===2)f=1.3;c=shade(base,f);}t.set(x,y,c);}
  for(var i=0;i<5;i++){var cx=(R()*TS)|0,cy=(R()*TS)|0;for(var j=0;j<5;j++)t.set(cx+j,cy+(j>>1),shade(base,.7));}return t;}
function texMoss(){var t=texStone(),R=rng(53),m1=HEX('#4f8a2c'),m2=HEX('#3a6e20'),m3=HEX('#78b844'),m4=HEX('#2c5418');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var p=.78-y/50+Math.sin(x*.45)*.18+Math.sin(x*.19+1)*.15+(h2(x>>1,y>>1)-.5)*.3;if(R()<p){var r=R();t.set(x,y,r<.15?m3:r<.55?m1:r<.85?m2:m4);}}
  for(var i=0;i<9;i++){var dx=(R()*TS)|0,len=6+(R()*18|0);for(var j=0;j<len;j++){t.set(dx,12+j,j===len-1?m3:m2);if(j<len-3)t.set(dx+1,12+j,m4);}}return t;}
function texDoor(){var t=new Pix(TS,TS),base=HEX('#5a6ea8'),dark=HEX('#26305a'),lite=HEX('#9cb0e8'),R=rng(61);
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var f=.95+R()*.07,c=shade(base,f);
    if(x<4||x>59||y<4||y>59)c=(x<2||x>61||y<2||y>61)?shade(dark,.8):dark;else if(x<6||y<6)c=lite;else if(x>57||y>57)c=shade(base,.62);
    else if(y>=28&&y<=35)c=shade(base,y<=29?1.38:y>=34?.58:1.08);else if(x>=30&&x<=33&&y>7&&y<56)c=shade(base,x<=31?.58:1.22);
    t.set(x,y,c);}
  [[10,10],[52,10],[10,52],[52,52],[10,31],[52,31]].forEach(function(p){t.set(p[0],p[1],lite);t.set(p[0]+1,p[1],lite);t.set(p[0],p[1]+1,lite);t.set(p[0]+1,p[1]+1,shade(base,1.15));t.set(p[0]+2,p[1]+1,dark);t.set(p[0]+1,p[1]+2,dark);t.set(p[0]+2,p[1]+2,dark);});
  for(var yy=40;yy<52;yy++)for(var xx=14;xx<50;xx++)if(((xx+yy)&7)<2)t.set(xx,yy,shade(base,((xx+yy)&7)?.62:.78));return t;}
function texLocked(){var t=new Pix(TS,TS),base=HEX('#c08f2a'),dark=HEX('#5a3e0e'),lite=HEX('#ffd970'),R=rng(71),hole=HEX('#1a1006');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var f=.92+R()*.08,c=shade(base,f);
    if(x<4||x>59||y<4||y>59)c=dark;else if(x<6||y<6)c=lite;else if(x>57||y>57)c=shade(base,.6);
    else if((x===12||x===13||x===50||x===51)&&y>9&&y<54)c=shade(base,.68);else if((x===14||x===52)&&y>9&&y<54)c=shade(base,1.28);t.set(x,y,c);}
  t.ell(32,25,10,10,shade(base,.6));t.ell(32,25,8.4,8.4,lite);t.ell(32,25,7,7,shade(lite,.9));t.ell(32,25,5,5,hole);
  for(var yy=28;yy<45;yy++){var hw=2+((yy-28)/4|0);for(var xx=32-hw;xx<32+hw;xx++)t.set(xx,yy,hole);}
  t.ell(29.5,22.5,1.5,1.5,HEX('#fff6c8'));for(var i=0;i<4;i++){t.set(10+i*14,54,lite);t.set(11+i*14,54,lite);t.set(10+i*14,8,lite);t.set(11+i*14,8,lite);}return t;}
function texFence(){var t=new Pix(TS,TS),post=HEX('#3d7a3a'),postD=HEX('#285226'),postL=HEX('#5fa64e'),lat=HEX('#6db35a'),latD=HEX('#41813a');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var c=0;
    if(x<4||x>59)c=(x===0||x===60)?postL:(x===3||x===63)?postD:post;else if(y===4||y===56)c=postL;else if(y===5||y===57)c=post;else if(y===6||y===58)c=postD;
    else if(y>6&&y<56){var a=(x+y)&15,b=(x-y+128)&15;if(a<2)c=a?lat:postL;else if(b<2)c=b?latD:lat;}

/* ---------- M18 slot machine: in-game coins only. Odds per spin (fixed, shown on the machine):

  if(id==='power'){var k=PU_IDS[Math.floor(R2()*PU_IDS.length)%PU_IDS.length];return {coins:0,power:k,msg:'POWER-UP: '+PU[k].name+'!'};}

/* high score API client (research/highscore-api.md): same-origin RELATIVE paths only, no credentials in the game,
   the browser's existing same-origin auth is reused (credentials:'same-origin'). Offline / file:// -> local top 10. */
var HS_API='/api/labyrinth',LOCAL_HS_KEY='labyrinthRemake.localScores.v1';
var HS={online:null,loading:false,list:[],local:true,msg:'',hl:null,busy:false,loadSeq:0};
function hsValidName(n){if(typeof n!=='string')return false;n=n.trim();return n.length>=1&&n.length<=16&&/^[A-Za-z0-9 _.\-]+$/.test(n);}
function hsValidate(e){if(!e||typeof e!=='object')return 'BAD ENTRY';if(!hsValidName(e.name))return 'BAD NAME';
  if(!Number.isInteger(e.floor)||e.floor<1||e.floor>MAX_FLOOR)return 'BAD FLOOR';
  if(!Number.isInteger(e.score)||e.score<0||e.score>SCORE_MAX||e.score>e.floor*100000)return 'BAD SCORE';
  if(typeof e.seed!=='string'||!/^[A-Za-z0-9_\-]{1,32}$/.test(e.seed))return 'BAD SEED';
  if(JSON.stringify({name:e.name.trim(),score:e.score,floor:e.floor,seed:e.seed}).length>2048)return 'ENTRY TOO LARGE';return '';}
function hsUnreachable(){return location.protocol==='file:'||(typeof navigator!=='undefined'&&navigator.onLine===false)||typeof fetch!=='function';}
function hsFetch(path,opts,ms){opts=opts||{};var o={method:opts.method||'GET',credentials:'same-origin',cache:'no-store',headers:opts.headers||{}},ctl=typeof AbortController!=='undefined'?new AbortController():null,tm=0;
  if(opts.body!==undefined)o.body=opts.body;if(ctl){o.signal=ctl.signal;tm=setTimeout(function(){try{ctl.abort();}catch(e){}},ms||4000);}stats.hsRequests.push(o.method+' '+HS_API+path);
  return fetch(HS_API+path,o).then(function(r){if(tm)clearTimeout(tm);return r;},function(err){if(tm)clearTimeout(tm);throw err;});}
function hsCheck(cb){if(hsUnreachable()){HS.online=false;cb(false);return;}
  hsFetch('/health',{},3000).then(function(r){return r.ok?r.json():null;}).then(function(j){HS.online=!!(j&&j.ok===true);cb(HS.online);}).catch(function(){HS.online=false;cb(false);});}
function hsRow(o){if(!o||typeof o!=='object')return null;var n=cleanName(o.name).trim(),sd=String(o.seed==null?'':o.seed).replace(/[^A-Za-z0-9_\-]/g,'').slice(0,32);if(!n)return null;
  return {rank:Math.max(0,o.rank|0),name:n,score:Math.max(0,Math.min(SCORE_MAX,Math.floor(+o.score)||0)),floor:Math.max(1,Math.min(MAX_FLOOR,Math.floor(+o.floor)||1)),seed:sd};}
function localScores(){var a=[];try{a=JSON.parse(localStorage.getItem(LOCAL_HS_KEY)||'[]');}catch(e){a=[];}if(!Array.isArray(a))a=[];
  a=a.filter(function(e){return e&&!hsValidate({name:e.name,score:e.score,floor:e.floor,seed:e.seed});});a.sort(function(p,q){return q.score-p.score||String(p.created_at).localeCompare(String(q.created_at));});
  return a.slice(0,10).map(function(e,i){return {rank:i+1,name:e.name.trim(),score:e.score,floor:e.floor,seed:e.seed,created_at:e.created_at};});}
function localAdd(entry){var a=localScores(),me={name:entry.name.trim(),score:entry.score,floor:entry.floor,seed:entry.seed,created_at:new Date().toISOString(),me:Math.random()};a.push(me);
  a.sort(function(p,q){return q.score-p.score||String(p.created_at).localeCompare(String(q.created_at));});a=a.slice(0,10);var rank=a.indexOf(me)+1;
  try{localStorage.setItem(LOCAL_HS_KEY,JSON.stringify(a.map(function(e){return {name:e.name,score:e.score,floor:e.floor,seed:e.seed,created_at:e.created_at};})));}catch(e){}stats.hsLocalSaves++;return rank;}
function hsLoad(){var seq=++HS.loadSeq;HS.loading=true;
  var useLocal=function(note){if(seq!==HS.loadSeq)return;HS.local=true;HS.list=localScores();HS.loading=false;if(note&&!HS.msg)HS.msg=note;};
  hsCheck(function(on){if(seq!==HS.loadSeq)return;if(!on){useLocal('');return;}
    hsFetch('/scores?limit=10',{},5000).then(function(r){if(!r.ok)throw new Error('status '+r.status);return r.json();}).then(function(j){if(seq!==HS.loadSeq)return;
      HS.list=(j&&Array.isArray(j.scores)?j.scores:[]).map(hsRow).filter(Boolean).slice(0,10);HS.local=false;HS.loading=false;})
    .catch(function(){useLocal('COULD NOT LOAD THE ONLINE BOARD - SHOWING LOCAL');});});}
function cleanMsg(s){return String(s||'ERROR').toUpperCase().replace(/[^A-Z0-9 .,:!?\-\/()]/g,' ').slice(0,28);}
function hsSubmit(entry,cb){var body=JSON.stringify({name:entry.name.trim(),score:entry.score,floor:entry.floor,seed:entry.seed});
  hsCheck(function(on){
    if(!on){var r=localAdd(entry);cb({msg:r?'OFFLINE - SAVED TO LOCAL SCORES (RANK '+r+')':'OFFLINE - NOT IN THE LOCAL TOP 10',highlight:r?{local:true,rank:r}:null});return;}
    hsFetch('/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:body},6000).then(function(res){return res.json().catch(function(){return {};}).then(function(j){return {status:res.status,j:j};});})
    .then(function(o){
      if(o.status===201&&o.j&&o.j.ok){stats.hsPosts++;cb({msg:'SCORE SENT! YOUR RANK: '+(o.j.rank|0),highlight:{local:false,rank:o.j.rank|0}});}
      else if(o.status===429)cb({retry:true,msg:'TOO MANY SCORES SENT. WAIT A MINUTE, THEN TRY AGAIN.'});
      else if(o.status===400)cb({msg:'SCORE REJECTED: '+cleanMsg(o.j&&o.j.error)});
      else{var r=localAdd(entry);cb({msg:'BOARD UNAVAILABLE ('+o.status+') - SAVED LOCALLY',highlight:r?{local:true,rank:r}:null});}})
    .catch(function(){HS.online=false;var r=localAdd(entry);cb({msg:'SERVER UNREACHABLE - SAVED LOCALLY',highlight:r?{local:true,rank:r}:null});});});}
var THROW_ANIM=.25;
function throwBalloon(){var p=G.p;p.throwT=.42;p.throwAnim=THROW_ANIM;var gi=effectIs('giant'),angs=effectIs('triple')?[0,-.17,.17]:[0];

    if(solidAt(sx,sy)){sx=p.x;sy=p.y;}G.shots.push({x:sx,y:sy,z:.36,vx:ca*6.6,vy:sa*6.6,vz:Math.min(2.40,1.8+6.6*(p.pitch/PROJ)),life:3,age:0,giant:gi});}); /* M12-A1 + M13-A2: cap 2.40 keeps the peak (0.956) under the 0.97 ceiling check */stats.throws++;SFX.throw();}
function giantSplash(x,y){stats.giantSplashes++;SFX.giantSplash();for(var k=0;k<22;k++){var a=Math.random()*Math.PI*2,sp=1+Math.random()*2.5;G.parts.push({kind:'drop',x:x,y:y,z:.1,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:1.5+Math.random()*2,life:.6+Math.random()*.3,g:7});}
  G.ents.forEach(function(e){if(e.gone||e.state==='dead')return;if(Math.hypot(e.x-x,e.y-y)<1.4&&clearPath(x,y,e.x,e.y)){hitEnemy(e);hitEnemy(e);}else if(Math.hypot(e.x-x,e.y-y)<1.4)stats.splashBlocked=(stats.splashBlocked||0)+1;});}
/* M16-A4: ray march through solidAt (walls, closed doors, fences); the burst's own cell and the target's cell don't block */
function clearPath(x0,y0,x1,y1){var d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/.05)),ac=Math.floor(x0)+','+Math.floor(y0),bc=Math.floor(x1)+','+Math.floor(y1);
  for(var i=1;i<n;i++){var t=i/n,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t,c=Math.floor(x)+','+Math.floor(y);if(c===ac||c===bc)continue;if(solidAt(x,y))return false;}return true;}
function splash(x,y,z){SFX.splash();for(var k=0;k<14;k++){var a=Math.random()*Math.PI*2,s=.6+Math.random()*1.6;G.parts.push({kind:'drop',x:x,y:y,z:Math.max(.02,z),vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:1+Math.random()*1.8,life:.5+Math.random()*.3,g:7});}}
function sparkle(x,y,z,kind,n){for(var k=0;k<n;k++){var a=Math.random()*Math.PI*2;G.parts.push({kind:kind,x:x,y:y,z:z,vx:Math.cos(a)*.8,vy:Math.sin(a)*.8,vz:.8+Math.random(),life:.45,g:2});}}
function poof(x,y,lp){lp=lp||{x:x,y:y};SFX.pop();for(var k=0;k<7;k++){var a=k/7*Math.PI*2;G.parts.push({kind:'puff',x:x,y:y,z:.25,vx:Math.cos(a)*.9,vy:Math.sin(a)*.9,vz:.3,life:.6+Math.random()*.2,g:0,max:.8});}sparkle(x,y,.4,'spark',8);

function updateFx(dt){
  for(var i=G.shots.length-1;i>=0;i--){var s=G.shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.vz-=5*dt;s.life-=dt;s.age=(s.age||0)+dt;var hit=false;
    var fe=fenceGhostHit(s);
    if(fe){hitEnemy(fe);s.x=fe.x;s.y=fe.y;hit=true;stats.fenceHits++;}
    else if(solidAt(s.x,s.y)){s.x-=s.vx*dt*1.5;s.y-=s.vy*dt*1.5;hit=true;}
    else if(s.z<=.02){s.z=.02;hit=true;}
    else if(s.z>=.97){s.z=.97;hit=true;stats.ceilingHits++;} // M12-A1 safety net: splash on the ceiling
    else for(var j=0;j<G.ents.length;j++){var e=G.ents[j];if(e.gone||e.state==='dead')continue;var M=MOBS[e.type],ez=mobZ(e);var sc=e.scale||1;if(Math.hypot(e.x-s.x,e.y-s.y)<M.hitR*sc+(s.giant?.25:0)&&s.z>ez-.10&&s.z<ez+M.h*sc+.12){hitEnemy(e);hit=true;break;}}
    if(hit||s.life<=0){splash(s.x,s.y,s.z);if(s.giant)giantSplash(s.x,s.y);G.shots.splice(i,1);}}
  for(i=G.parts.length-1;i>=0;i--){var q=G.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=q.g*dt;q.life-=dt;if(q.kind==='puff'||q.kind==='steam'){q.vx*=.92;q.vy*=.92;}if(q.z>.95){q.z=.95;q.vz=0;}if(q.z<0){q.z=0;q.vz=0;q.vx*=.5;q.vy*=.5;}if(q.life<=0)G.parts.splice(i,1);}
}
/* M13-A3: fences stop balloons, but a ghost (Hazewisp) sitting inside a fence cell is checked first, so it can be hit there

function fenceGhostHit(s){var cx=Math.floor(s.x),cy=Math.floor(s.y),c=cellAt(cx,cy);if(!c||c.t!==3)return null;var sp=Math.hypot(s.vx,s.vy)||1,ux=s.vx/sp,uy=s.vy/sp;
  for(var j=0;j<G.ents.length;j++){var e=G.ents[j];if(e.gone||e.state==='dead'||Math.floor(e.x)!==cx||Math.floor(e.y)!==cy)continue;var M=MOBS[e.type],sc=e.scale||1,ez=mobZ(e),rx=e.x-s.x,ry=e.y-s.y;
    if(Math.abs(rx*uy-ry*ux)<M.hitR*sc+(s.giant?.25:0)&&rx*ux+ry*uy>-.3&&s.z>ez-.10&&s.z<ez+M.h*sc+.12)return e;}return null;}

function voice(e){e.sndT=3.5+Math.random()*2.5;stats.voices[e.type]=(stats.voices[e.type]||0)+1;if(e.type==='screamer')scream(e);else SFX[MOBS[e.type].voice]();}

/* ---------- M1.4: elite mobs (modifiers), enemy projectiles, slime puddles ---------- */
/* ONE place to tune elites: chance per floor (floor 1 = tutorial), when 2 modifiers start, caps and weights */
var ELITE_CFG={perFloor:.05,tutorial:0,twoModsFrom:6,twoModChance:{6:.5,7:.75,8:1},maxPuddles:40,maxEnemyShots:40,puddleLife:9,
  weights:{ranged:3,slime:3,beefy:3,fast:2,regen:1}};

function rollMods(R,floor){if(R()>=eliteChance(floor))return [];var c2=twoModChance(floor),n=c2>=1?2:(c2>0&&R()<c2?2:1),out=[]; /* M16: 2 modifiers phase in: 50% L6, 75% L7, 100% L8+ */

/* per-mob ranged attack: projectile kind, speed (cells/s), cooldown, telegraph time, homing (rad/s), sound */
var RANGED={kettle:{kind:'steam',spd:4.2,cd:2.6,tele:.5,snd:'eSteam'},zapfly:{kind:'zap',spd:7,cd:2.1,tele:.35,snd:'eZap'},clunk:{kind:'laser',spd:9.5,cd:3.2,tele:.75,snd:'eLaser'},
  screamer:{kind:'sonic',spd:5,cd:2.8,tele:.5,snd:'eSonic'},wisp:{kind:'wisp',spd:3.2,cd:3,tele:.55,home:.9,snd:'eWisp'},springle:{kind:'fluff',spd:5.5,cd:2.4,tele:.4,snd:'eFluff'}};

  if(mods.indexOf('fast')>=0)e.spdMul*=1.4;

function hasMod(e,m){return !!(e.mods&&e.mods.indexOf(m)>=0);}
function rollLevelElites(floor){var R=rng(hashSeed(G.seed+':'+floor+':elite')),n=0,k=deepHpMul(floor);G.ents.forEach(function(e){var m=rollMods(R,floor);applyMods(e,m);if(k>1){e.maxHp=Math.ceil(e.maxHp*k);e.hp=e.maxHp;}if(m.length)n++;});return n;}
function fireAt(e){var R=RANGED[e.type],p=G.p,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;if(G.eshots.length>=ELITE_CFG.maxEnemyShots)G.eshots.shift();
