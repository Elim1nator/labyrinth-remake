<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#screen{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
#touch{position:fixed;inset:0;display:none;touch-action:none}
#touch.on{display:block}
.tbtn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(20,16,42,.45);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.25);color:#fff;font:bold 13px/1 system-ui,sans-serif;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;margin:0;touch-action:none;transition:transform .06s,background .06s;-webkit-user-select:none;user-select:none;outline:none}
.tbtn svg{width:46%;height:46%;pointer-events:none}
.tbtn span{pointer-events:none;font-size:11px;text-shadow:0 1px 0 #000}
.tbtn.down{transform:scale(.92);background:rgba(90,150,255,.5)}
#btnPause{border-radius:12px;border-width:2px}
#btnPause svg{width:55%;height:55%}
#btnMap{border-radius:12px;border-width:2px;border-color:rgba(140,210,255,.85);background:rgba(10,30,60,.5)}
#btnMap svg{width:64%;height:64%}
#btnUse{display:none;border-color:rgba(255,220,90,.85);background:rgba(60,44,8,.5)}
#btnUse.show{display:flex;animation:pulse 1s ease-in-out infinite}
#nameIn{position:fixed;display:none;opacity:0;font-size:16px;border:0;padding:0;margin:0;background:transparent;color:transparent;caret-color:transparent;z-index:6;outline:none}
#nameIn.on{display:block}
#btnItem{display:none;border-color:rgba(130,255,170,.9);background:rgba(10,52,34,.55)}
#btnItem.show{display:flex}
#btnItem canvas{width:54%;height:54%;image-rendering:pixelated;pointer-events:none}
#btnBall{display:none;border-color:rgba(255,160,200,.9);background:rgba(52,14,40,.55)}
#btnBall.show{display:flex}
#btnBall canvas{width:50%;height:50%;image-rendering:pixelated;pointer-events:none}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,220,90,.7),0 3px 0 rgba(0,0,0,.45)}}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(20,16,42,.35));display:none;pointer-events:none}
#stick.on{display:block}
#stick.ghost{display:block;opacity:.35}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fb4ff 45%,#4a5aa8);box-shadow:0 2px 6px rgba(0,0,0,.5)}
#rotate{position:fixed;inset:0;display:none;background:#14102a;color:#ffe9a0;font:bold 18px/1.4 system-ui,sans-serif;text-align:center;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;padding:24px;box-sizing:border-box}
#rotate.on{display:flex}
#rotate .ph{width:54px;height:92px;border:5px solid #ffe9a0;border-radius:10px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

function RGB(r,g,b){return (0xff000000|(b<<16)|(g<<8)|r)>>>0;}
function HEX(h){var n=parseInt(h.slice(1),16);return RGB(n>>16&255,n>>8&255,n&255);}
function shade(c,f){var r=(c&255)*f,g=(c>>8&255)*f,b=(c>>16&255)*f;return RGB(r>255?255:r|0,g>255?255:g|0,b>255?255:b|0);}

var VIEW={base:5,cur:5,near:.3};function setFogCol(c){FOG=c;FR=c&255;FG=c>>8&255;FB=c>>16&255;}

Pix.prototype.rect=function(x,y,w,h,c){var k=this.k,x0=Math.round(x*k),y0=Math.round(y*k),x1=Math.round((x+w)*k),y1=Math.round((y+h)*k);for(var j=y0;j<y1;j++)for(var i=x0;i<x1;i++)this.raw(i,j,c);};

    xs.sort(function(p,q){return p-q;});for(var j=0;j+1<xs.length;j+=2)for(var x=Math.ceil(xs[j]-.5);x<=Math.floor(xs[j+1]-.5);x++)this.raw(x,y,typeof c==='function'?c(x/k,y/k):c);}};

/* ---------- M19 slot machine: in-game coins only, NO spin limit, 3 coins a spin. Odds per spin (fixed, printed on the machine):
   nothing 62% | three coins +5 14% | heart 8% (1 coin if full) | power-up 6% | JACKPOT 2%: 25 coins spray out across the room |
   CRIT FAIL 8%: three skulls, 1 + 1 per 3 floors monsters (max 8) spawn next to the machine.
   Expected coins back per 3-coin spin = 0.14*5 + 0.02*25 = 1.2 = 0.40 x the cost (0.43 with hearts full). Even counting the coin each
   crit-fail monster drops when popped it stays below 0.62 x the cost, so the machine is a coin sink and can never loop. ---------- */

  if(id==='heart')return hearts<maxHearts()?{coins:0,heart:1,msg:'THREE HEARTS! +1 HEART'}:{coins:1,msg:'HEARTS FULL - 1 COIN INSTEAD'};
  if(id==='power'){var k=randPU(R2);if(!k)return {coins:5,msg:'POWER-UP... YOU HAVE THEM ALL! +5 COINS'};return {coins:0,power:k,msg:'POWER-UP: '+PU[k].name+'!'};}
  if(id==='crit'){var n=critCount(floor||1);return {coins:0,crit:n,msg:'CRIT FAIL! 3 SKULLS - '+n+' MONSTER'+(n>1?'S':'')+'!'};}
  return {coins:0,msg:'NO LUCK THIS TIME.'};}

function placePowerups(idx){var L=G.L,floor=idx+1,R=rng(hashSeed(G.seed+':'+floor+':pu')),n=idx===0?1:2+(floor>=5?1:0);
  if(idx===0){G.items.push({kind:'power',ptype:'sneakers',x:13.5,y:10.5,ph:0});return 1;}
  var n0=L.w*L.h,dist=new Int16Array(n0).fill(-1),q=[],s=Math.floor(L.start.y)*L.w+Math.floor(L.start.x);dist[s]=0;q.push(s);
  for(var h=0;h<q.length;h++){var i=q[h],x=i%L.w,y=(i/L.w)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(o){var nx=x+o[0],ny=y+o[1];if(nx<0||ny<0||nx>=L.w||ny>=L.h)return;var j=ny*L.w+nx;if(dist[j]>=0)return;var c=L.cells[j];if(c.t===1||c.t===3||c.t===5)return;dist[j]=dist[i]+1;q.push(j);});}
  var used={};G.items.forEach(function(it){used[Math.floor(it.y)*L.w+Math.floor(it.x)]=1;});G.ents.forEach(function(e){used[Math.floor(e.y)*L.w+Math.floor(e.x)]=1;});
  var cand=[];for(var j=0;j<n0;j++){var c=L.cells[j];if(c.t===0&&dist[j]>=5&&!used[j])cand.push(j);}
  var placed=0;for(var k=0;k<n&&cand.length;k++){var ci=(R()*cand.length)|0,cell=cand.splice(ci,1)[0],pk=randPU(R);if(!pk)continue;G.items.push({kind:'power',ptype:pk,x:cell%L.w+.5,y:((cell/L.w)|0)+.5,ph:k});placed++;}return placed;}
