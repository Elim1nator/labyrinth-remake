<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#screen{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
#touch{position:fixed;inset:0;display:none;touch-action:none}
#touch.on{display:block}
.tbtn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(20,16,42,.45);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.25);color:#fff;font:bold 13px/1 system-ui,sans-serif;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;margin:0;touch-action:none;transition:transform .06s,background .06s;-webkit-user-select:none;user-select:none;outline:none}
.tbtn svg{width:46%;height:46%;pointer-events:none}
.tbtn span{pointer-events:none;font-size:11px;text-shadow:0 1px 0 #000}
.tbtn.down{transform:scale(.92);background:rgba(90,150,255,.5)}
#btnUse{display:none;border-color:rgba(255,220,90,.85);background:rgba(60,44,8,.5)}
#btnUse.show{display:flex;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,220,90,.7),0 3px 0 rgba(0,0,0,.45)}}
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(20,16,42,.35));display:none;pointer-events:none}
#stick.on{display:block}
#stick.ghost{display:block;opacity:.35}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fb4ff 45%,#4a5aa8);box-shadow:0 2px 6px rgba(0,0,0,.5)}
#rotate{position:fixed;inset:0;display:none;background:#14102a;color:#ffe9a0;font:bold 18px/1.4 system-ui,sans-serif;text-align:center;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;padding:24px;box-sizing:border-box}
#rotate.on{display:flex}
#rotate .ph{width:54px;height:92px;border:5px solid #ffe9a0;border-radius:10px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

<canvas id="screen" width="320" height="200" aria-label="Labyrinth Remake game screen"></canvas>

  <button class="tbtn" id="btnUse" aria-label="Use"><svg viewBox="0 0 24 24"><path fill="#ffe08a" d="M8 11V5a1.5 1.5 0 013 0v5h1V3.5a1.5 1.5 0 013 0V10h1V5a1.5 1.5 0 013 0v9c0 4-3 7-7 7-3 0-5-1.6-6.4-4L3.3 13a1.5 1.5 0 012.5-1.6L8 14z"/></svg><span>USE</span></button>

</div>
<div id="rotate"><div class="ph"></div><div>Please turn your phone sideways<br>(landscape) to play.</div></div>
<script>
(function(){
'use strict';
/* ===================================================================
   Labyrinth Remake - M1 first playable.
   Everything here (code, pixel art, sounds, levels) is original and
   generated in code. Inspired by early-90s maze shooters.
   =================================================================== */
var W=320,H=200,HALF=100,PLANE=0.66,PROJ=(W/2)/PLANE,TS=32;
var SAVE_KEY='labyrinthRemake.save.v1';
var MAX_HEARTS=5;

/* ---------- PWA bits: inline manifest + icon as data URLs ---------- */
(function(){
  var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='#14102a'/><rect x='3' y='5' width='10' height='9' fill='#7bc83a'/><rect x='4' y='4' width='8' height='1' fill='#7bc83a'/><rect x='6' y='6' width='4' height='4' fill='#fff'/><rect x='7' y='7' width='2' height='2' fill='#1b3a0a'/><rect x='5' y='11' width='6' height='2' fill='#3a0d12'/><rect x='7' y='1' width='2' height='3' fill='#9aa0aa'/><rect x='3' y='1' width='10' height='1' fill='#c8ccd4'/></svg>";
  var icon='data:image/svg+xml,'+encodeURIComponent(svg);
  document.getElementById('icon').href=icon;
  var man={name:'Labyrinth Remake',short_name:'Labyrinth',display:'fullscreen',orientation:'landscape',background_color:'#000000',theme_color:'#14102a',start_url:'.',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any'}]};
  document.getElementById('manifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
})();

/* ---------- framebuffer ---------- */
var cv=document.getElementById('screen');
var ctx=cv.getContext('2d',{alpha:false});
var img=ctx.createImageData(W,H);
var buf=new Uint32Array(img.data.buffer);
var depth=new Float32Array(W*H);
function RGB(r,g,b){return (0xff000000|(b<<16)|(g<<8)|r)>>>0;}
function HEX(h){var n=parseInt(h.slice(1),16);return RGB(n>>16&255,n>>8&255,n&255);}
function shade(c,f){var r=(c&255)*f,g=(c>>8&255)*f,b=(c>>16&255)*f;return RGB(r>255?255:r|0,g>255?255:g|0,b>255?255:b|0);}
function mix(c1,c2,t){var it=1-t;return RGB(((c1&255)*it+(c2&255)*t)|0,((c1>>8&255)*it+(c2>>8&255)*t)|0,((c1>>16&255)*it+(c2>>16&255)*t)|0);}
var FOG=HEX('#0c0a16'),FR=FOG&255,FG=FOG>>8&255,FB=FOG>>16&255;
function fogMix(c,t){var it=256-t;return (0xff000000|((((c>>16&255)*it+FB*t)>>8)<<16)|((((c>>8&255)*it+FG*t)>>8)<<8)|(((c&255)*it+FR*t)>>8))>>>0;}
function fogT(d){var t=d*17;return t>215?215:t|0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- tiny pixel painter ---------- */
function Pix(w,h){this.w=w;this.h=h;this.px=new Uint32Array(w*h);}
Pix.prototype.set=function(x,y,c){x=x|0;y=y|0;if(x>=0&&y>=0&&x<this.w&&y<this.h)this.px[y*this.w+x]=c;};
Pix.prototype.get=function(x,y){x=x|0;y=y|0;if(x<0||y<0||x>=this.w||y>=this.h)return 0;return this.px[y*this.w+x];};
Pix.prototype.rect=function(x,y,w,h,c){for(var j=y;j<y+h;j++)for(var i=x;i<x+w;i++)this.set(i,j,c);};
Pix.prototype.ell=function(cx,cy,rx,ry,c){for(var y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(var x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){var dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,typeof c==='function'?c(x,y,dx,dy):c);}};
Pix.prototype.thick=function(x0,y0,x1,y1,r,c){var n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2)+1;for(var i=0;i<=n;i++){var t=i/n;this.ell(x0+(x1-x0)*t,y0+(y1-y0)*t,r,r,c);}};
Pix.prototype.outline=function(c){var src=this.px.slice(),w=this.w,h=this.h;for(var y=0;y<h;y++)for(var x=0;x<w;x++){if(src[y*w+x]>>>24)continue;var n=(x>0&&src[y*w+x-1]>>>24)||(x<w-1&&src[y*w+x+1]>>>24)||(y>0&&src[(y-1)*w+x]>>>24)||(y<h-1&&src[(y+1)*w+x]>>>24);if(n)this.px[y*w+x]=c;}return this;};
Pix.prototype.darken=function(f){var p=new Pix(this.w,this.h);for(var i=0;i<this.px.length;i++){var c=this.px[i];p.px[i]=c>>>24?shade(c,f):0;}return p;};

/* ---------- procedural wall textures (32x32) ---------- */
function texBrick(){var t=new Pix(TS,TS),R=rng(11),mortar=HEX('#857866'),cols=['#a8442c','#b5502f','#9a3b28','#b8583a','#a04a30'].map(HEX);
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var row=y>>3,off=(row&1)?8:0,bx=(x+off)&15,by=y&7,c;
    if(by===7||bx===15)c=shade(mortar,.8+R()*.3);else{var id=(row*7+((x+off)>>4)*3)%5,f=.85+R()*.22;if(by===0||bx===0)f+=.2;if(by===6||bx===14)f-=.22;c=shade(cols[id],f);}t.set(x,y,c);}return t;}
function texStone(){var t=new Pix(TS,TS),R=rng(23),base=HEX('#6c7488');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var row=y>>4,off=(row&1)?8:0,bx=(x+off)&15,by=y&15,f=.9+R()*.18;
    if(bx===15||by===15)f=.45;else if(bx===0||by===0)f=1.3;else if(bx===14||by===14)f=.7;if(R()<.06)f*=.75;var id=(row*3+((x+off)>>4))%3;t.set(x,y,shade(base,f*(1+id*.05)));}return t;}
function texWood(){var t=new Pix(TS,TS),R=rng(37),cols=['#8a5a32','#7c4f2b','#94633a','#83552f'].map(HEX);
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var pl=x>>3,lx=x&7,f=.92+R()*.12;if(Math.sin(y*.55+pl*2.1+Math.sin(x*1.3)*.6)>.86)f*=.72;if(lx===0)f=1.18;if(lx===7)f=.55;
    var c=shade(cols[pl],f);if((y===3||y===28)&&lx===3)c=HEX('#d8c8a0');if((y===4||y===29)&&lx===3)c=HEX('#3a2614');t.set(x,y,c);}return t;}
function texTile(){var t=new Pix(TS,TS),R=rng(41),base=HEX('#2f8f8a'),grout=HEX('#183836');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var lx=x&7,ly=y&7,c;if(lx===7||ly===7)c=grout;else{var f=.92+R()*.1+(((x>>3)+(y>>3))&1)*.08;if(lx===0||ly===0)f+=.15;if(lx===1&&ly===1)f=1.6;if(lx===6||ly===6)f-=.15;c=shade(base,f);}t.set(x,y,c);}return t;}
function texMoss(){var t=texStone(),R=rng(53),m1=HEX('#4f8a2c'),m2=HEX('#3a6e20'),m3=HEX('#78b844');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var p=.75-y/26+Math.sin(x*.9)*.18+Math.sin(x*.37+1)*.15;if(R()<p){var r=R();t.set(x,y,r<.2?m3:r<.6?m1:m2);}}
  for(var i=0;i<5;i++){var dx=(R()*TS)|0,len=4+(R()*10|0);for(var j=0;j<len;j++)t.set(dx,6+j,j===len-1?m3:m2);}return t;}
function texDoor(){var t=new Pix(TS,TS),base=HEX('#5a6ea8'),dark=HEX('#26305a'),lite=HEX('#9cb0e8'),R=rng(61);
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var f=.95+R()*.08,c=shade(base,f);
    if(x<2||x>29||y<2||y>29)c=dark;else if(x===2||y===2)c=lite;else if(x===29||y===29)c=shade(base,.65);
    else if(y>=14&&y<=17)c=shade(base,y===14?1.35:y===17?.6:1.1);else if((x===15||x===16)&&y>3&&y<28)c=shade(base,x===15?.6:1.2);
    t.set(x,y,c);}
  [[5,5],[26,5],[5,26],[26,26],[5,15],[26,15]].forEach(function(p){t.set(p[0],p[1],lite);t.set(p[0]+1,p[1]+1,dark);});
  for(var yy=20;yy<26;yy++)for(var xx=7;xx<25;xx++)if(((xx+yy)&3)===0)t.set(xx,yy,shade(base,.7));return t;}
function texLocked(){var t=new Pix(TS,TS),base=HEX('#c08f2a'),dark=HEX('#5a3e0e'),lite=HEX('#ffd970'),R=rng(71),hole=HEX('#1a1006');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var f=.92+R()*.1,c=shade(base,f);
    if(x<2||x>29||y<2||y>29)c=dark;else if(x===2||y===2)c=lite;else if(x===29||y===29)c=shade(base,.62);
    else if((x===6||x===25)&&y>4&&y<27)c=shade(base,.7);else if((x===7||x===26)&&y>4&&y<27)c=shade(base,1.25);t.set(x,y,c);}
  t.ell(16,12.5,5,5,shade(base,.62));t.ell(16,12.5,4,4,lite);t.ell(16,12.5,2.6,2.6,hole);
  for(var yy=14;yy<23;yy++){var hw=1+((yy-14)/4|0);for(var xx=16-hw;xx<16+hw;xx++)t.set(xx,yy,hole);}
  for(var i=0;i<4;i++){t.set(5+i*7,27,lite);t.set(5+i*7,4,lite);}return t;}
function texFence(){var t=new Pix(TS,TS),post=HEX('#3d7a3a'),postD=HEX('#285226'),postL=HEX('#5fa64e'),lat=HEX('#6db35a'),latD=HEX('#41813a');
  for(var y=0;y<TS;y++)for(var x=0;x<TS;x++){var c=0;
    if(x<2||x>29)c=(x===0||x===30)?postL:post;else if(y===2||y===28)c=postL;else if(y===3||y===29)c=postD;
    else if(y>3&&y<28){var a=(x+y)&7,b=(x-y+64)&7;if(a===0)c=lat;else if(b===0)c=latD;}
    if(x===1||x===31)c=postD;t.set(x,y,c);}return t;}

/* ---------- sprites (original pixel art, painted in code) ---------- */
function sprBlob(frame){var s=new Pix(32,32),G1=HEX('#93dc44'),G2=HEX('#6db32c'),G3=HEX('#4b8a1d'),HL=HEX('#d2f78a');
  function body(x,y){var sx=(x+.5-16)/11,sy=(y+.5-19)/11,v=sx*.55+sy*.6;var hx=x+.5-11,hy=y+.5-11.5;if(hx*hx/9+hy*hy/4<1)return HL;return v>.62?G3:v>.22?G2:G1;}
  s.ell(16,13.5,7.5,7.5,body);s.ell(16,21,11,9.5,body);
  s.ell(16,15,6,6,function(x,y,dx,dy){return dx+dy>.9?HEX('#c9d0e0'):HEX('#ffffff');});
  s.ell(16.5,15.5,3.6,3.6,HEX('#2f7a24'));s.ell(16.5,15.5,2.6,2.6,HEX('#4aa236'));s.ell(16.5,15.5,1.6,1.6,HEX('#0a0f08'));s.set(15,14,HEX('#ffffff'));s.set(14,13,HEX('#ffffff'));
  var M=HEX('#3a0d12'),T=HEX('#fff4d4'),TG=HEX('#e0607a');
  for(var y=23;y<=27;y++)for(var x=8;x<=24;x++){var dx=(x+.5-16)/7.5,dy=(y+.5-23)/4.6;if(dx*dx+dy*dy<=1)s.set(x,y,M);}
  for(x=10;x<=22;x++){if(x%3!==1)s.set(x,23,T);}s.set(12,26,T);s.set(20,26,T);s.set(15,26,TG);s.set(16,26,TG);s.set(17,26,TG);s.set(16,25,TG);
  var P=HEX('#8d929c'),PL=HEX('#d0d4dc'),PD=HEX('#555a64');s.rect(15,3,2,4,P);s.set(16,3,PL);s.rect(14,2,4,1,PD);
  if(frame===0){s.rect(4,1,24,1,PL);s.rect(4,2,10,1,P);s.rect(18,2,10,1,P);}else{s.rect(11,1,10,1,PL);s.rect(12,2,8,1,P);}
  s.outline(HEX('#16280a'));return s;}
function sprCoin(){var s=new Pix(10,10);s.ell(5,5,4.6,4.6,HEX('#b8860b'));s.ell(5,5,3.7,3.7,function(x,y,dx,dy){return dx+dy<-.6?HEX('#fff2a0'):dx+dy>.7?HEX('#d9a520'):HEX('#f4c832');});s.rect(4,3,2,4,HEX('#c08e14'));s.set(4,3,HEX('#fff2a0'));s.outline(HEX('#4a3204'));return s;}
function sprKey(){var s=new Pix(16,9),G=HEX('#f2c531'),D=HEX('#a8780a'),L=HEX('#fff0a0');s.ell(4,4.5,3.8,3.8,G);s.ell(4,4.5,1.6,1.6,0);s.set(2,2,L);s.set(3,2,L);s.rect(7,3,8,2,G);s.rect(7,4,8,1,D);s.rect(11,5,2,2,G);s.rect(14,5,1,3,G);s.set(9,3,L);s.outline(HEX('#4a3204'));
  for(var y=3;y<6;y++)for(var x=3;x<6;x++){var dx=x+.5-4,dy=y+.5-4.5;if(dx*dx+dy*dy<2.6)s.set(x,y,0);}return s;}
function sprHeart(full){var rows=['.##.##.','#######','#######','.#####.','..###..','...#...'],s=new Pix(9,8),R=full?HEX('#e83a4a'):HEX('#3a2232'),D=full?HEX('#a01c2c'):HEX('#2a1824');
  for(var y=0;y<6;y++)for(var x=0;x<7;x++)if(rows[y][x]==='#')s.set(x+1,y+1,(x>3&&y>1)||y>3?D:R);if(full){s.set(2,2,HEX('#ffd0d4'));s.set(2,3,HEX('#ff9aa4'));}s.outline(full?HEX('#3a0610'):HEX('#7a6a80'));return s;}
function sprBalloon(){var s=new Pix(8,9);s.ell(4,4,3.6,3.9,function(x,y,dx,dy){return dx+dy>.5?HEX('#1f4fb8'):HEX('#3f7bea');});s.set(2,2,HEX('#dbe8ff'));s.set(3,2,HEX('#9cc0ff'));s.set(4,8,HEX('#3f7bea'));s.outline(HEX('#0d2a6a'));return s;}
function sprPuff(){var s=new Pix(14,12),C=function(x,y,dx,dy){return dy>.35?HEX('#c8cede'):HEX('#ffffff');};s.ell(5,7,4.2,3.8,C);s.ell(9,6.5,4.2,4.2,C);s.ell(7,4.5,3.6,3.4,C);s.outline(HEX('#8890a4'));return s;}
function sprSpark(){var s=new Pix(5,5),Y=HEX('#fff38a'),O=HEX('#ffb02a');s.set(2,0,O);s.set(2,4,O);s.set(0,2,O);s.set(4,2,O);s.rect(1,1,3,3,Y);s.set(2,2,HEX('#ffffff'));return s;}
function sprDrop(){var s=new Pix(2,2);s.rect(0,0,2,2,HEX('#9fd0ff'));s.set(0,0,HEX('#e8f6ff'));return s;}
function sprPortal(phase){var s=new Pix(24,34),cols=['#4ae0ff','#ffffff','#b46cff','#2a7bff'].map(HEX);
  for(var y=8;y<34;y++)for(var x=0;x<24;x++){var dx=(x+.5-12)/11.5,dy=(y+.5-21)/12.5,r=Math.sqrt(dx*dx+dy*dy);if(r>1)continue;var a=Math.atan2(dy,dx),v=Math.floor((a/(Math.PI*2)*6+r*5-phase*1.0)*1.0);v=((v%4)+4)%4;s.set(x,y,r<.25?cols[1]:cols[v]);}
  s.rect(3,0,18,7,HEX('#1a3a14'));s.rect(4,1,16,5,HEX('#3fae3a'));drawTextPix(s,'EXIT',5,1,HEX('#ffffff'));s.outline(HEX('#0a0820'));return s;}
function sprHand(withBalloon){var s=new Pix(84,64),SL=HEX('#4c3524'),SLD=HEX('#36251a'),SLL=HEX('#634733'),CU=HEX('#6e6d2c'),CUL=HEX('#8f8c3c'),GL=HEX('#26252c'),GLL=HEX('#3e3c48'),SK=HEX('#e2a878'),SKD=HEX('#b97c50'),B1=HEX('#3f7bea'),B2=HEX('#2a5cc8'),B3=HEX('#1c3f96'),BH=HEX('#dbe8ff'),BM=HEX('#8db4ff');
  s.thick(86,74,53,42,11,function(x,y){return x+y>124?SLD:x+y<108?SLL:SL;});
  s.thick(55,44,52,41,11.5,function(x,y){return (x+y)%6===0?CUL:CU;});

function update(dt){
  G.time+=dt;G.modeT+=dt;if(G.msgT>0){G.msgT-=dt;if(G.msgT<=0)G.msg='';}
  if(G.mode==='title'){cam.ang=G.time*.18;inp.confirm=false;return;}
  if(G.mode==='play'){updatePlay(dt);}
  else{updateFx(dt);if(inp.confirm&&G.modeT>.5){inp.confirm=false;
    if(G.mode==='pause'){G.mode='play';G.modeT=0;}
    else if(G.mode==='dead'){var s=loadSave();startLevel(G.levelIdx,{hearts:MAX_HEARTS,coins:s?s.coins:0});}
    else if(G.mode==='clear'){if(G.levelIdx+1<LEVELS.length)startLevel(G.levelIdx+1,{hearts:G.p.hearts,coins:G.p.coins});else{G.mode='win';G.modeT=0;clearSave();SFX.clear();}}
    else if(G.mode==='win'){toTitle();}
  }inp.confirm=false;}
  inp.use=false;inp.pause=false;
}
function updatePlay(dt){
  var p=G.p;G.levelTime+=dt;
  if(inp.pause){inp.pause=false;G.mode='pause';G.modeT=0;if(locked&&document.exitPointerLock){hadLock=false;document.exitPointerLock();}return;}
  // turning
  var turn=0;if(keys.ArrowLeft)turn-=1;if(keys.ArrowRight)turn+=1;if(pad)turn+=pad.rx;
  p.ang+=inp.lookDX+turn*2.7*dt;inp.lookDX=0;
  // movement
  var fw=0,st=0;if(keys.KeyW||keys.ArrowUp)fw+=1;if(keys.KeyS||keys.ArrowDown)fw-=1;if(keys.KeyD)st+=1;if(keys.KeyA)st-=1;
  if(pad){fw-=pad.ly;st+=pad.lx;}
  if(touchState.stickId!==null){fw-=touchState.vy;st+=touchState.vx;}
  var m=Math.hypot(fw,st);if(m>1){fw/=m;st/=m;m=1;}
  var run=keys.ShiftLeft||keys.ShiftRight||(touchState.stickId!==null&&Math.hypot(touchState.vx,touchState.vy)>.92);
  var sp=2.7*(run?1.45:1)*dt,ca=Math.cos(p.ang),sa=Math.sin(p.ang);
  var dx=(ca*fw-sa*st)*sp,dy=(sa*fw+ca*st)*sp;
  if(m>0.01){moveBody(p,dx,dy,.22);p.bob+=dt*9*m*(run?1.3:1);p.moving=Math.min(1,p.moving+dt*6);}else p.moving=Math.max(0,p.moving-dt*4);
  // use target + use
  G.useTarget=findUse();
  if(inp.use){inp.use=false;doUse();}
  // throwing
  if(p.throwT>0)p.throwT-=dt;if(p.throwAnim>0)p.throwAnim-=dt;
  if((keys.Space||keys.ControlLeft||keys.ControlRight||inp.throwMouse||inp.throwTouch||inp.throwPad)&&p.throwT<=0)throwBalloon();
  updateDoors(dt);if(!api.freeze)updateEnemies(dt);updateFx(dt);
  // pickups
  for(var i=0;i<G.items.length;i++){var it=G.items[i];if(it.taken)continue;if(Math.hypot(it.x-p.x,it.y-p.y)<.5){
    if(it.kind==='coin'){it.taken=true;p.coins++;SFX.coin();sparkle(it.x,it.y,.25,'spark',4);}
    else if(it.kind==='key'){it.taken=true;p.keys++;SFX.key();setMsg('GOT THE GOLD KEY!',2.5);sparkle(it.x,it.y,.25,'spark',8);}
    else if(it.kind==='heart'&&p.hearts<MAX_HEARTS){it.taken=true;p.hearts++;SFX.heart();setMsg('+1 HEART',1.5);}}}
  if(p.inv>0)p.inv-=dt;if(p.hurtT>0)p.hurtT-=dt;
  // exit
  var c=cellAt(Math.floor(p.x),Math.floor(p.y));
  if(c&&c.t===4){G.mode='clear';G.modeT=0;SFX.clear();if(locked&&document.exitPointerLock){hadLock=false;document.exitPointerLock();}}
}
function findUse(){var p=G.p,ca=Math.cos(p.ang),sa=Math.sin(p.ang);for(var d=.1;d<=1.45;d+=.05){var c=cellAt(Math.floor(p.x+ca*d),Math.floor(p.y+sa*d));if(!c||c.t===1||c.t===3)return null;if(c.t===2){if(c.locked||c.open<.99||c.state==='closing')return c;return null;}}return null;}
function doUse(){var d=G.useTarget;if(!d){return;}
  if(d.locked){if(G.p.keys>0){G.p.keys--;d.locked=false;d.tex=5;d.state='opening';setMsg('UNLOCKED!',2);SFX.unlock();SFX.door();}else{setMsg('LOCKED! FIND THE GOLD KEY.',2.5);SFX.locked();}return;}
  if(d.state==='closed'||d.state==='closing'){d.state='opening';SFX.door();}}
function cellOccupied(d){function ov(x,y,r){return x+r>d.x&&x-r<d.x+1&&y+r>d.y&&y-r<d.y+1;}if(ov(G.p.x,G.p.y,.25))return true;for(var i=0;i<G.ents.length;i++){var e=G.ents[i];if(!e.gone&&e.state!=='dead'&&ov(e.x,e.y,.3))return true;}return false;}
function updateDoors(dt){G.L.doors.forEach(function(d){
  if(d.state==='opening'){d.open+=dt*1.8;if(d.open>=1){d.open=1;d.state='open';d.timer=4;}}
  else if(d.state==='open'){d.timer-=dt;if(d.timer<=0){if(cellOccupied(d))d.timer=.5;else{d.state='closing';SFX.door();}}}
  else if(d.state==='closing'){if(cellOccupied(d)){d.state='opening';}else{d.open-=dt*1.8;if(d.open<=0){d.open=0;d.state='closed';}}}});}
function computeDist(){var L=G.L,n=L.w*L.h,dist=new Int16Array(n).fill(-1),q=new Int32Array(n),h=0,t=0,s=Math.floor(G.p.y)*L.w+Math.floor(G.p.x);dist[s]=0;q[t++]=s;
  while(h<t){var i=q[h++],x=i%L.w,y=(i/L.w)|0,nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];for(var k=0;k<4;k++){var nx=nb[k][0],ny=nb[k][1];if(nx<0||ny<0||nx>=L.w||ny>=L.h)continue;var j=ny*L.w+nx;if(dist[j]>=0)continue;var c=L.cells[j];if(c.t===1||c.t===3||(c.t===2&&c.open<.8))continue;dist[j]=dist[i]+1;if(dist[j]<24)q[t++]=j;}}
  return dist;}
function updateEnemies(dt){var p=G.p;G.distT-=dt;if(G.distT<=0||!G.dist){G.dist=computeDist();G.distT=.25;}
  for(var i=0;i<G.ents.length;i++){var e=G.ents[i];if(e.gone)continue;e.ph+=dt;if(e.hurtT>0)e.hurtT-=dt;
    if(e.state==='dead'){e.deadT+=dt;if(e.deadT>.12&&!e.popped){e.popped=true;e.gone=true;poof(e.x,e.y);}continue;}
    var dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);
    if(e.state==='idle'){if(d<9&&los(e.x,e.y,p.x,p.y)){e.state='chase';SFX.alert();}continue;}
    var sp=1.55*dt,tx=null,ty=null;
    if(d<3.5&&los(e.x,e.y,p.x,p.y)){tx=p.x;ty=p.y;}
    else{var L=G.L,ex=Math.floor(e.x),ey=Math.floor(e.y),best=G.dist[ey*L.w+ex],bx=null,by=null;if(best<0)best=999;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(o){var nx=ex+o[0],ny=ey+o[1];if(nx<0||ny<0||nx>=L.w||ny>=L.h)return;var v=G.dist[ny*L.w+nx];if(v>=0&&v<best){best=v;bx=nx;by=ny;}});
      if(bx!==null){tx=bx+.5;ty=by+.5;}}
    if(tx!==null&&d>.45){var mx=tx-e.x,my=ty-e.y,ml=Math.hypot(mx,my)||1;moveBody(e,mx/ml*sp,my/ml*sp,.28);}
    for(var j=0;j<G.ents.length;j++){var o=G.ents[j];if(o===e||o.gone||o.state==='dead')continue;var ox=e.x-o.x,oy=e.y-o.y,od=Math.hypot(ox,oy);if(od<.5&&od>0){moveBody(e,ox/od*.02,oy/od*.02,.28);}}
    if(e.atkT>0)e.atkT-=dt;
    if(d<.6&&e.atkT<=0){e.atkT=1.1;hurtPlayer(e);}
  }}
function hurtPlayer(e){var p=G.p;if(p.inv>0)return;p.hearts--;p.inv=1;p.hurtT=.35;SFX.hurt();vib(60);var dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;for(var k=0;k<8;k++)moveBody(p,dx/d*.05,dy/d*.05,.22);
  if(p.hearts<=0){p.hearts=0;G.mode='dead';G.modeT=0;SFX.die();if(locked&&document.exitPointerLock){hadLock=false;document.exitPointerLock();}}}
function throwBalloon(){var p=G.p;p.throwT=.42;p.throwAnim=.3;var ca=Math.cos(p.ang),sa=Math.sin(p.ang),sx=p.x+ca*.25-sa*.08,sy=p.y+sa*.25+ca*.08;
  if(solidAt(sx,sy)){sx=p.x;sy=p.y;}G.shots.push({x:sx,y:sy,z:.36,vx:ca*6.6,vy:sa*6.6,vz:1.5,life:3});SFX.throw();}
function splash(x,y,z){SFX.splash();for(var k=0;k<14;k++){var a=Math.random()*Math.PI*2,s=.6+Math.random()*1.6;G.parts.push({kind:'drop',x:x,y:y,z:Math.max(.02,z),vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:1+Math.random()*1.8,life:.5+Math.random()*.3,g:7});}}
function sparkle(x,y,z,kind,n){for(var k=0;k<n;k++){var a=Math.random()*Math.PI*2;G.parts.push({kind:kind,x:x,y:y,z:z,vx:Math.cos(a)*.8,vy:Math.sin(a)*.8,vz:.8+Math.random(),life:.45,g:2});}}
function poof(x,y){SFX.pop();for(var k=0;k<7;k++){var a=k/7*Math.PI*2;G.parts.push({kind:'puff',x:x,y:y,z:.25,vx:Math.cos(a)*.9,vy:Math.sin(a)*.9,vz:.3,life:.6+Math.random()*.2,g:0,max:.8});}sparkle(x,y,.4,'spark',8);
  G.stats.defeated++;G.items.push({kind:'coin',x:x,y:y,ph:0});setMsg('POP!',1);}
function updateFx(dt){
  for(var i=G.shots.length-1;i>=0;i--){var s=G.shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.vz-=5*dt;s.life-=dt;var hit=false;
    if(solidAt(s.x,s.y)){s.x-=s.vx*dt*1.5;s.y-=s.vy*dt*1.5;hit=true;}
    else if(s.z<=.02){s.z=.02;hit=true;}
    else for(var j=0;j<G.ents.length;j++){var e=G.ents[j];if(e.gone||e.state==='dead')continue;var ez=blobZ(e);if(Math.hypot(e.x-s.x,e.y-s.y)<.38&&s.z>ez-.08&&s.z<ez+.66){hitEnemy(e);hit=true;break;}}
    if(hit||s.life<=0){splash(s.x,s.y,s.z);G.shots.splice(i,1);}}
  for(i=G.parts.length-1;i>=0;i--){var q=G.parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=q.g*dt;q.life-=dt;if(q.kind==='puff'){q.vx*=.92;q.vy*=.92;}if(q.z<0){q.z=0;q.vz=0;q.vx*=.5;q.vy*=.5;}if(q.life<=0)G.parts.splice(i,1);}
}
function hitEnemy(e){e.hp--;e.hurtT=.18;if(e.state==='idle'){e.state='chase';}if(e.hp<=0){e.state='dead';e.deadT=0;}else SFX.hit();}
function blobZ(e){return .14+Math.sin(e.ph*3)*.05;}

/* ---------- renderer ---------- */
function setCam(x,y,ang,z){cam.x=x;cam.y=y;cam.ang=ang;cam.z=z;cam.dx=Math.cos(ang);cam.dy=Math.sin(ang);cam.px=-cam.dy*PLANE;cam.py=cam.dx*PLANE;}
var stats={rays:0,wallPx:0,fencePx:0,spritePx:0,frames:0};
function renderWorld(){
  var L=G.L,fl=L.floor,ce=L.ceil,y,x,i;
  for(y=0;y<H;y++){var d,c;if(y<HALF){d=(1-cam.z)*PROJ/(HALF-y-.5);c=fogMix(shade(ce,1+(HALF-y)/300),fogT(d));}else{d=cam.z*PROJ/(y+.5-HALF);c=fogMix(fl,fogT(d));if(y>HALF+30&&((y>>1)&1))c=shade(c,1.03);}
    var o=y*W;for(x=0;x<W;x++){buf[o+x]=c;depth[o+x]=d+.01;}}
  stats.rays=0;stats.wallPx=0;stats.fencePx=0;
  var masked=[];
  for(x=0;x<W;x++){var camX=2*x/W-1,rdx=cam.dx+cam.px*camX,rdy=cam.dy+cam.py*camX,mx=Math.floor(cam.x),my=Math.floor(cam.y);
    var ddx=rdx===0?1e30:Math.abs(1/rdx),ddy=rdy===0?1e30:Math.abs(1/rdy),stx,sty,sdx,sdy;
    if(rdx<0){stx=-1;sdx=(cam.x-mx)*ddx;}else{stx=1;sdx=(mx+1-cam.x)*ddx;}
    if(rdy<0){sty=-1;sdy=(cam.y-my)*ddy;}else{sty=1;sdy=(my+1-cam.y)*ddy;}
    masked.length=0;stats.rays++;
    for(var n=0;n<80;n++){var tEnter,side;if(sdx<sdy){tEnter=sdx;sdx+=ddx;mx+=stx;side=0;}else{tEnter=sdy;sdy+=ddy;my+=sty;side=1;}
      if(mx<0||my<0||mx>=L.w||my>=L.h){drawSlice(x,tEnter,TEX[1],.5,side===1,false);break;}
      var ci=my*L.w+mx,cell=L.cells[ci];L.seen[ci]=1;
      if(cell.t===1){var wx=side===0?cam.y+tEnter*rdy:cam.x+tEnter*rdx,u=wx-Math.floor(wx);if((side===0&&rdx>0)||(side===1&&rdy<0))u=1-u;drawSlice(x,tEnter,TEX[cell.tex],u,side===1,false);stats.wallPx++;break;}
      if(cell.t===2||cell.t===3){var tExit=Math.min(sdx,sdy),t,uu;
        if(cell.axis===0){if(rdx===0)continue;t=(mx+.5-cam.x)/rdx;uu=cam.y+t*rdy-my;}else{if(rdy===0)continue;t=(my+.5-cam.y)/rdy;uu=cam.x+t*rdx-mx;}
        if(t<tEnter-1e-6||t>tExit+1e-6||uu<0||uu>=1)continue;
        if(cell.t===2){if(uu>=cell.open){drawSlice(x,t,TEX[cell.tex],uu-cell.open,cell.axis===1,false);break;}}
        else masked.push(t,uu,cell.axis);
      }}
    for(i=masked.length-3;i>=0;i-=3){drawSlice(x,masked[i],TEX[7],masked[i+1],masked[i+2]===1,true);stats.fencePx++;}
  }
}
function drawSlice(x,dist,tex,u,dark,trans){if(dist<.02)dist=.02;var lineH=PROJ/dist,top=HALF-(1-cam.z)*lineH,bot=HALF+cam.z*lineH,y0=Math.max(0,Math.ceil(top-.5)),y1=Math.min(H,Math.ceil(bot-.5));
  var tx=Math.min(TS-1,Math.max(0,(u*TS)|0)),px=dark?tex.dark.px:tex.px,ft=fogT(dist),stepv=TS/lineH,v=(y0+.5-top)*stepv;
  for(var y=y0;y<y1;y++){var ty=v|0;v+=stepv;if(ty>TS-1)ty=TS-1;var c=px[ty*TS+tx];if(trans&&!(c>>>24))continue;var idx=y*W+x;if(dist>=depth[idx])continue;depth[idx]=dist;buf[idx]=fogMix(c,ft);}}
function drawSprite(s,x,y,z,wh,o){o=o||{};var rx=x-cam.x,ry=y-cam.y,ty=rx*cam.dx+ry*cam.dy;if(ty<.15)return;var camX=(rx*cam.px+ry*cam.py)/(PLANE*PLANE*ty),scx=(1+camX)*W/2,sc=PROJ/ty,hp=wh*sc,wp=hp*s.w/s.h*(o.sx===undefined?1:o.sx);
  if(wp<0)wp=-wp;var bottom=HALF+(cam.z-z)*sc,top=bottom-hp,left=scx-wp/2,x0=Math.max(0,Math.ceil(left-.5)),x1=Math.min(W-1,Math.floor(left+wp-.5)),y0=Math.max(0,Math.ceil(top-.5)),y1=Math.min(H-1,Math.floor(bottom-.5)),ft=fogT(ty),tint=o.tint||0;
  for(var X=x0;X<=x1;X++){var u=((X+.5-left)/wp*s.w)|0;if(u<0||u>=s.w)continue;for(var Y=y0;Y<=y1;Y++){var v=((Y+.5-top)/hp*s.h)|0;if(v<0||v>=s.h)continue;var c=s.px[v*s.w+u];if(!(c>>>24))continue;var idx=Y*W+X;if(ty>=depth[idx])continue;depth[idx]=ty;
    buf[idx]=tint?mix(c,0xffffffff,tint):fogMix(c,ft);stats.spritePx++;}}}
function renderSprites(){var list=[],t=G.time,i;
  G.items.forEach(function(it){if(it.taken)return;if(it.kind==='coin')list.push({s:SPR.coin,x:it.x,y:it.y,z:.12+Math.sin(t*3+it.ph)*.04,h:.22,sx:Math.abs(Math.cos(t*3+it.ph))*.85+.15});
    else if(it.kind==='key')list.push({s:SPR.key,x:it.x,y:it.y,z:.15+Math.sin(t*2.5)*.05,h:.17});
    else list.push({s:SPR.heart,x:it.x,y:it.y,z:.12+Math.sin(t*3)*.04,h:.24});});
  if(G.L.exit)list.push({s:SPR.portal[((t*8)|0)%4],x:G.L.exit.x+.5,y:G.L.exit.y+.5,z:0,h:.95});
  G.ents.forEach(function(e){if(e.gone)return;var sq=1,wh=.62,tint=e.hurtT>0?.75:0;if(e.state==='dead'){sq=1+e.deadT*3;tint=.9;}else if(e.hurtT>0){sq=1.18;wh=.55;}
    list.push({s:SPR.blob[((e.ph*14)|0)&1],x:e.x,y:e.y,z:blobZ(e),h:wh*(e.state==='dead'?sq:1),sx:sq,tint:tint});});
  G.shots.forEach(function(s){list.push({s:SPR.balloon,x:s.x,y:s.y,z:s.z-.06,h:.13});});
  G.parts.forEach(function(q){if(q.kind==='drop')list.push({s:SPR.drop,x:q.x,y:q.y,z:q.z,h:.035});else if(q.kind==='spark')list.push({s:SPR.spark,x:q.x,y:q.y,z:q.z,h:.07});else{var k=q.life/(q.max||.8);list.push({s:SPR.puff,x:q.x,y:q.y,z:q.z,h:.18+.25*(1-k)});}});
  for(i=0;i<list.length;i++){var o=list[i],rx=o.x-cam.x,ry=o.y-cam.y;o.d=rx*cam.dx+ry*cam.dy;}
  list.sort(function(a,b){return b.d-a.d;});
  stats.spritePx=0;stats.sprites=list.length;
  for(i=0;i<list.length;i++){var s=list[i];drawSprite(s.s,s.x,s.y,s.z,s.h,s);}
}
function blit(s,x,y,sc,dim){sc=sc||1;x=Math.round(x);y=Math.round(y);for(var v=0;v<s.h*sc;v++){var Y=y+v;if(Y<0||Y>=H)continue;for(var u=0;u<s.w*sc;u++){var X=x+u;if(X<0||X>=W)continue;var c=s.px[((v/sc)|0)*s.w+((u/sc)|0)];if(c>>>24)buf[Y*W+X]=dim?shade(c,dim):c;}}}
function blend(x,y,w,h,c,a){var r=c&255,g=c>>8&255,b=c>>16&255;for(var Y=Math.max(0,y);Y<Math.min(H,y+h);Y++)for(var X=Math.max(0,x);X<Math.min(W,x+w);X++){var i=Y*W+X,o=buf[i];buf[i]=RGB(((o&255)*(1-a)+r*a)|0,((o>>8&255)*(1-a)+g*a)|0,((o>>16&255)*(1-a)+b*a)|0);}}
function frameBox(x,y,w,h,c){for(var X=x;X<x+w;X++){px(X,y,c);px(X,y+h-1,c);}for(var Y=y;Y<y+h;Y++){px(x,Y,c);px(x+w-1,Y,c);}}
function px(x,y,c){if(x>=0&&y>=0&&x<W&&y<H)buf[y*W+x]=c;}

/* HUD layout in internal pixels (also used by the layout tests) */
var HUD_RECT=[1,1,84,24],BAND_RECT=[90,2,172,12],MAP_RECT=[266,2,52,52];
function drawHand(){var p=G.p,b=Math.sin(p.bob)*3*p.moving,b2=Math.abs(Math.cos(p.bob))*3*p.moving,ta=p.throwAnim>0?p.throwAnim/.3:0;
  var x=186+b,y=H-60+b2;if(ta>0){y-=Math.sin(ta*Math.PI)*16;x-=Math.sin(ta*Math.PI)*10;}
  var empty=p.throwT>.12;if(empty)y+=Math.max(0,(p.throwT-.12))*120;blit(empty?SPR.handE:SPR.hand,x,y,1);}
function drawHUD(){var p=G.p,W1=HEX('#ffffff'),Y1=HEX('#ffe27a'),GR=HEX('#a8a4c0');
  blend(HUD_RECT[0],HUD_RECT[1],HUD_RECT[2],HUD_RECT[3],HEX('#0d0a1e'),.62);frameBox(HUD_RECT[0],HUD_RECT[1],HUD_RECT[2],HUD_RECT[3],HEX('#4a4470'));
  for(var i=0;i<MAX_HEARTS;i++){var hs=i<p.hearts?SPR.heart:SPR.heartE,sh=(p.hurtT>0&&i===p.hearts)?((G.time*30|0)&1):0;blit(hs,4+i*9+sh,3,1);}
  blit(SPR.coin,4,14,1);drawText('X'+p.coins,16,16,Y1,1);
  var kx=50,ky=13;blend(kx,ky,30,10,HEX('#000000'),.4);frameBox(kx,ky,30,10,HEX('#6a6490'));if(p.keys>0){blit(SPR.key,kx+2,ky+1,1);if(p.keys>1)drawText('X'+p.keys,kx+19,ky+3,W1,1);}else{blit(SPR.key,kx+2,ky+1,1,.25);}
  // message band
  blend(BAND_RECT[0],BAND_RECT[1],BAND_RECT[2],BAND_RECT[3],HEX('#0d0a1e'),.62);frameBox(BAND_RECT[0],BAND_RECT[1],BAND_RECT[2],BAND_RECT[3],HEX('#4a4470'));
  var m=G.msg,col=Y1;if(!m&&G.useTarget){m=G.useTarget.locked&&p.keys===0?'LOCKED DOOR':(G.touch?'TAP USE TO OPEN':(pad?'PRESS X TO OPEN':'PRESS E TO OPEN'));col=W1;}if(!m){m=G.L.def.name;col=GR;}
  if(m.length>42)m=m.slice(0,42);drawTextC(m,BAND_RECT[0]+BAND_RECT[2]/2,BAND_RECT[1]+4,col,1);
  if(G.minimap)drawMinimap();
  if(p.hurtT>0)blend(0,0,W,H,HEX('#ff2030'),Math.min(.45,p.hurtT*1.3));}
function drawMinimap(){var L=G.L,p=G.p,R=MAP_RECT,cs=4,n=12,ox=R[0]+2,oy=R[1]+2,cx0=Math.floor(p.x)-6,cy0=Math.floor(p.y)-6;
  blend(R[0],R[1],R[2],R[3],HEX('#0d0a1e'),.7);frameBox(R[0],R[1],R[2],R[3],HEX('#4a4470'));
  var fx=p.x-Math.floor(p.x),fy=p.y-Math.floor(p.y),offx=Math.round((.5-fx)*cs),offy=Math.round((.5-fy)*cs);
  for(var j=-1;j<=n;j++)for(var i=-1;i<=n;i++){var mx=cx0+i,my=cy0+j;if(mx<0||my<0||mx>=L.w||my>=L.h)continue;var idx=my*L.w+mx;if(!L.seen[idx])continue;var c=L.cells[idx],col;
    if(c.t===1)col=MAPCOL[c.tex];else if(c.t===2)col=c.locked?HEX('#ffc630'):HEX('#7a9cff');else if(c.t===3)col=HEX('#5fa64e');else if(c.t===4)col=((G.time*4)|0)&1?HEX('#4ae0ff'):HEX('#b46cff');else col=HEX('#2a2640');
    for(var b=0;b<cs;b++)for(var a=0;a<cs;a++){var X=ox+i*cs+a+offx,Y=oy+j*cs+b+offy;if(X<R[0]+1||Y<R[1]+1||X>=R[0]+R[2]-1||Y>=R[1]+R[3]-1)continue;if(c.t===3&&((a+b)&1))continue;buf[Y*W+X]=col;}}
  function dot(wx,wy,col){var X=Math.round(ox+(wx-cx0)*cs+offx-.5*cs+cs/2),Y=Math.round(oy+(wy-cy0)*cs+offy-.5*cs+cs/2);X-=Math.round(cs/2)-0;Y-=Math.round(cs/2)-0;for(var b=0;b<2;b++)for(var a=0;a<2;a++){var xx=X+a,yy=Y+b;if(xx>R[0]&&yy>R[1]&&xx<R[0]+R[2]-1&&yy<R[1]+R[3]-1)buf[yy*W+xx]=col;}}
  G.items.forEach(function(it){if(it.taken)return;if(!L.seen[Math.floor(it.y)*L.w+Math.floor(it.x)])return;dot(it.x,it.y,it.kind==='key'?HEX('#ffe27a'):it.kind==='heart'?HEX('#ff6070'):HEX('#c89a20'));});
  G.ents.forEach(function(e){if(e.gone||e.state==='dead')return;if(!L.seen[Math.floor(e.y)*L.w+Math.floor(e.x)])return;dot(e.x,e.y,HEX('#9be04a'));});
  var pX=ox+6*cs+cs/2+offx-.5,pY=oy+6*cs+cs/2+offy-.5,ca=Math.cos(p.ang),sa=Math.sin(p.ang);for(var k=0;k<5;k++)px(Math.round(pX+ca*k),Math.round(pY+sa*k),HEX('#ffe27a'));
  for(b=-1;b<=1;b++)for(a=-1;a<=1;a++)px(Math.round(pX)+a,Math.round(pY)+b,HEX('#ffffff'));}
function panel(x,y,w,h){blend(x,y,w,h,HEX('#0d0a1e'),.8);frameBox(x,y,w,h,HEX('#ffe27a'));frameBox(x+1,y+1,w-2,h-2,HEX('#4a4470'));}
function fmtTime(t){var s=Math.floor(t),m=Math.floor(s/60);s%=60;return m+':'+(s<10?'0':'')+s;}
function drawTitle(){var t=G.time,Y1=HEX('#ffe27a'),OR=HEX('#ff9a3a'),W1=HEX('#ffffff'),GR=HEX('#a8a4c0');
  blend(0,0,W,H,HEX('#0d0a1e'),.55);
  drawTextC('LABYRINTH',W/2,16,Y1,4,HEX('#5a2a08'));drawTextC('REMAKE',W/2,42,OR,3,HEX('#3a1404'));
  drawTextC('M1 TEST BUILD - PLACEHOLDER TITLE',W/2,62,GR,1);
  blit(SPR.blob[((t*14)|0)&1],W/2-32,70+Math.sin(t*3)*3,2);
  for(var i=0;i<G.menuItems.length;i++){var it=G.menuItems[i],sel=i===G.menuSel,lbl=it.label,w=textW(lbl,2),x=Math.round(W/2-w/2),y=140+i*14;it.rect=[x,y,w,10];
    if(sel){blend(x-8,y-3,w+16,16,HEX('#3a2a70'),.7);drawText('>',x-7+((t*4|0)&1),y,Y1,2);}drawText(lbl,x,y,sel?Y1:W1,2);}
  drawTextC(G.touch?'LEFT THUMB: MOVE   RIGHT DRAG: LOOK':'WASD MOVE  MOUSE LOOK  SPACE THROW  E USE',W/2,176,GR,1);
  drawTextC('INSPIRED BY EARLY-90S MAZE SHOOTERS',W/2,188,HEX('#6e6a90'),1);}
function render(){
  stats.frames++;G.frame++;
  if(G.mode==='title'){setCam(2.5+Math.cos(G.time*.1)*.8,2.5,G.time*.25,.5);renderWorld();renderSprites();drawTitle();}
  else{var p=G.p;setCam(p.x,p.y,p.ang,.5+Math.sin(p.bob*2)*.012*p.moving);renderWorld();renderSprites();drawHand();drawHUD();
    var Y1=HEX('#ffe27a'),W1=HEX('#ffffff'),GR=HEX('#a8a4c0'),cont=G.touch?'TAP TO CONTINUE':(pad?'PRESS A TO CONTINUE':'CLICK OR PRESS ENTER');
    if(G.mode==='pause'){panel(80,70,160,52);drawTextC('PAUSED',W/2,80,Y1,2);drawTextC(G.touch?'TAP TO RESUME':'CLICK OR PRESS ENTER',W/2,100,W1,1);drawTextC('ESC OR P PAUSES',W/2,110,GR,1);}
    else if(G.mode==='dead'){blend(0,0,W,H,HEX('#400818'),.5);panel(60,64,200,64);drawTextC('OUT OF HEARTS!',W/2,74,HEX('#ff7080'),2);drawTextC('THE BLOBS GOT YOU THIS TIME.',W/2,94,W1,1);if(G.modeT>.5)drawTextC(G.touch?'TAP TO RETRY':'PRESS ENTER TO RETRY',W/2,110,Y1,1);}
    else if(G.mode==='clear'){var st=G.stats;panel(56,46,208,100);drawTextC('LEVEL '+(G.levelIdx+1)+' CLEAR!',W/2,56,Y1,2);
      drawTextC('COINS  '+(p.coins-st.coins0)+' / '+st.coinsTotal,W/2,80,W1,1);drawTextC('BLOBS POPPED  '+st.defeated+' / '+st.enemiesTotal,W/2,92,W1,1);drawTextC('TIME  '+fmtTime(G.levelTime),W/2,104,W1,1);
      if(G.modeT>.5)drawTextC(G.levelIdx+1<LEVELS.length?cont:cont,W/2,126,((G.time*3)|0)&1?Y1:GR,1);}
    else if(G.mode==='win'){blend(0,0,W,H,HEX('#0d0a1e'),.5);panel(40,40,240,112);drawTextC('YOU ESCAPED!',W/2,52,Y1,3);drawTextC('THAT IS ALL OF THE M1 TEST MAZES.',W/2,82,W1,1);drawTextC('TOTAL COINS  '+p.coins,W/2,96,W1,1);drawTextC('MORE LEVELS, BOSSES AND A SHOP SOON.',W/2,110,GR,1);if(G.modeT>.5)drawTextC(G.touch?'TAP FOR TITLE':'PRESS ENTER FOR TITLE',W/2,134,Y1,1);}
  }
  ctx.putImageData(img,0,0);
}

/* ---------- layout / sizing ---------- */
var LAY={s:1,x:0,y:0,w:W,h:H};
var rotateEl=document.getElementById('rotate');
function isPortrait(){return innerHeight>innerWidth;}
function layout(){var vw=innerWidth,vh=innerHeight,s=Math.min(vw/W,vh/H),cw=Math.floor(W*s),ch=Math.floor(H*s);LAY={s:s,x:Math.floor((vw-cw)/2),y:Math.floor((vh-ch)/2),w:cw,h:ch};
  cv.style.width=cw+'px';cv.style.height=ch+'px';cv.style.left=LAY.x+'px';cv.style.top=LAY.y+'px';
  var bs=Math.round(Math.max(60,Math.min(100,vh*.22))),pad2=Math.round(Math.max(12,vh*.04)),us=Math.round(bs*.74);
  btnThrow.style.width=btnThrow.style.height=bs+'px';btnThrow.style.right='calc('+pad2+'px + env(safe-area-inset-right, 0px))';btnThrow.style.bottom='calc('+pad2+'px + env(safe-area-inset-bottom, 0px))';
  btnUse.style.width=btnUse.style.height=us+'px';btnUse.style.right='calc('+(pad2+Math.round(bs*1.12))+'px + env(safe-area-inset-right, 0px))';btnUse.style.bottom='calc('+(pad2+Math.round(bs*.62))+'px + env(safe-area-inset-bottom, 0px))';
  var R=stickRadius();stickEl.style.width=stickEl.style.height=(R*2)+'px';stickEl.style.margin=(-R)+'px 0 0 '+(-R)+'px';
  rotateEl.className=(G.touch&&isPortrait())?'on':'';}
function hudBottomPx(){return LAY.y+(MAP_RECT[1]+MAP_RECT[3])*LAY.s;}
function rectCss(r){return {x:LAY.x+r[0]*LAY.s,y:LAY.y+r[1]*LAY.s,w:r[2]*LAY.s,h:r[3]*LAY.s};}
addEventListener('resize',layout);addEventListener('orientationchange',function(){setTimeout(layout,100);});if(window.visualViewport)visualViewport.addEventListener('resize',layout);
document.addEventListener('visibilitychange',function(){if(document.hidden&&G.mode==='play'){G.mode='pause';G.modeT=0;}});
var forceUse=false;
function syncTouchUI(){var on=G.touch&&G.mode==='play'&&!isPortrait();touchEl.className=on||forceUse?'on':'';btnUse.className='tbtn'+((G.useTarget&&G.mode==='play')||forceUse?' show':'');
  if(G.touch&&isPortrait()){if(rotateEl.className!=='on')rotateEl.className='on';if(G.mode==='play'){G.mode='pause';G.modeT=0;}}else if(rotateEl.className==='on')rotateEl.className='';
  if(on&&touchState.stickId===null){var R=stickRadius();stickEl.className='ghost';stickEl.style.left=(LAY.x>R*2+20?LAY.x/2:Math.max(R+24,innerWidth*.14))+'px';stickEl.style.top=(innerHeight-R-Math.max(16,innerHeight*.06))+'px';}}

/* ---------- main loop ---------- */
var last=performance.now(),acc=0;
var api={manual:false,freeze:false};
function loop(now){requestAnimationFrame(loop);var dt=Math.min(.1,(now-last)/1000);last=now;pollPad();if(!api.manual){acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP;}}syncTouchUI();render();}
toTitle();layout();render();requestAnimationFrame(loop);

/* ---------- test hook (read-mostly; used by automated tests) ---------- */
api.state=function(){var p=G.p;return {mode:G.mode,level:G.levelIdx,msg:G.msg,touch:G.touch,player:p?{x:p.x,y:p.y,ang:p.ang,hearts:p.hearts,coins:p.coins,keys:p.keys}:null,
  enemies:G.ents.map(function(e){return {x:e.x,y:e.y,hp:e.hp,state:e.state,gone:e.gone,hurtT:e.hurtT};}),shots:G.shots.length,parts:G.parts.length,
  doors:G.L.doors.map(function(d){return {x:d.x,y:d.y,open:d.open,state:d.state,locked:d.locked};}),
  items:G.items.map(function(i){return {kind:i.kind,x:i.x,y:i.y,taken:!!i.taken};}),useTarget:G.useTarget?{x:G.useTarget.x,y:G.useTarget.y}:null,stats:Object.assign({},stats),save:loadSave(),menu:G.menuItems.map(function(m){return m.label;})};};
api.advance=function(sec){var n=Math.round(sec/STEP);for(var i=0;i<n;i++){pollPad();update(STEP);}syncTouchUI();render();return api.state();};
api.teleport=function(x,y,ang){G.p.x=x;G.p.y=y;if(ang!==undefined)G.p.ang=ang;G.useTarget=findUse();render();};
api.use=function(){inp.use=true;};
api.throwOnce=function(){if(G.mode==='play'){G.p.throwT=0;throwBalloon();}};
api.confirm=function(){inp.confirm=true;};
api.menuPick=menuPick;api.startLevel=function(i,c){startLevel(i,c||{hearts:MAX_HEARTS,coins:0});};api.toTitle=toTitle;
api.render=render;
api.setForceUse=function(b){forceUse=!!b;syncTouchUI();};
api.wakeAll=function(){G.ents.forEach(function(e){if(e.state==='idle')e.state='chase';});};
api.layout=function(){layout();syncTouchUI();function br(el){var r=el.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height,visible:r.width>0&&getComputedStyle(el).display!=='none'};}
  return {canvas:{x:LAY.x,y:LAY.y,w:LAY.w,h:LAY.h},band:rectCss(BAND_RECT),hud:rectCss(HUD_RECT),minimap:rectCss(MAP_RECT),throwBtn:br(btnThrow),useBtn:br(btnUse),stick:br(stickEl),portraitHint:rotateEl.className==='on'};};
api.pixelAt=function(x,y){var c=buf[y*W+x];return [c&255,c>>8&255,c>>16&255];};
window.__game=api;
})();
